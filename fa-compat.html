<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1A14">
<title>FA部品 互換サーチ</title>
<style>
  :root{
    --bg:#0F1A14; --panel:#151C24; --panel2:#2A3644; --amber:#E8A33D; --green:#4CAF7D;
    --muted:#8A99A8; --dim:#5C6B7A; --border:#354352; --text:#E8ECEF; --blue:#9DBBE8; --blueln:#4C6EA8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Segoe UI",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 64px}
  h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.5px}
  input,select,button{font-family:inherit}
  input::placeholder{color:var(--dim)}
  select,input[type=text]{width:100%;padding:11px 12px;background:var(--panel);color:var(--text);
    border:1px solid var(--border);border-radius:6px;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .seg{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 8px;border-radius:8px;
    font-size:13.5px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--muted);border:1px solid var(--border)}
  .seg.on{background:var(--amber);color:#0F1A14;font-weight:800;border-color:var(--amber)}
  .vbtn{flex:1;padding:10px 8px;border-radius:6px;font-size:12px;cursor:pointer;background:var(--panel);
    color:var(--muted);border:1px solid var(--border)}
  .vbtn.on{background:var(--amber);color:#0F1A14;font-weight:700;border-color:var(--amber)}
  .item{width:100%;text-align:left;padding:10px 12px;background:var(--panel);border:1px solid var(--border);
    border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .item .mdl{font-size:13px;color:var(--text);font-weight:600}
  .item .sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
  .item .cap{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;line-height:1.4}
  .badge{font-size:10px;margin-left:8px}
  .b-disc{color:var(--amber)} .b-ok{color:var(--green)}
  .card{padding:16px;background:var(--panel);border:1px solid var(--border);border-radius:8px}
  .lbl{font-size:11px;color:var(--muted)}
  .big{font-size:18px;font-weight:700;margin:2px 0 4px}
  .note{font-size:11px;color:var(--dim);margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:14px;font-size:13px}
  .field .k{font-size:10.5px;color:var(--muted)} .field .v{font-size:14px;color:var(--text)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:10.5px;padding:2px 7px;border-radius:4px;border:1px solid var(--blueln);color:var(--blue);background:#141E2C}
  .tag{padding:3px 8px;border-radius:4px;border:1px solid;background:transparent;font-size:11px}
  .cmp{margin-top:10px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:6px}
  .cmphead{font-size:12px;margin-bottom:8px;font-weight:700;display:flex;align-items:center;gap:6px}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 8px;font-size:12px}
  .g3b{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:4px 8px;font-size:12px}
  .succ{margin:12px 0 6px;padding:12px;background:#12241A;border:1px solid #2E5E3F;border-radius:8px}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .primary{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:var(--green);
    color:#0F1A14;border:none;border-radius:6px;font-weight:700;font-size:13px;cursor:pointer}
  .ghost{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:var(--panel2);
    color:var(--text);border:1px solid var(--border);border-radius:6px;font-weight:600;font-size:13px;cursor:pointer}
  .back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:0;margin-bottom:2px}
  .foot{margin-top:26px;padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    font-size:10.5px;color:var(--dim);line-height:1.7}
  .foot b{color:var(--muted)}
  .empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}
  .cnt{font-size:11px;color:var(--muted);margin:8px 0}
  svg{overflow:visible}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>

 if(m.altKey)h+='<button class="primary" onclick="searchAlt()">🔍 代替（'+esc(m.alt)+'）を検索</button><button class="ghost" onclick="go(\'search\')">↺ 検索へ戻る</button>';
 else h+='<button class="ghost" style="flex:1" onclick="go(\'search\')">↺ 検索へ戻る</button>';
 h+='</div>';
 return h;
}
function viewResult(){
 var m=byId(S.matchedId);if(!m)return viewSearch();
 var isSv=S.cat==="servo",isVec=(S.cat==="inv"&&S.invType==="vector");
 var comps=compatibles(m),chain=successorChain(m);
 var h='<button class="back" onclick="go(\'confirm\')">← 既設情報へ戻る</button>';
 h+='<div style="margin-top:8px;font-size:13px;color:#8A99A8">既設 <span class="mono" style="color:#E8ECEF">'+esc(m.model)+'</span>（'+(isSv?esc(m.ratedLabel):(m.ratedKW+"kW"))+' / '+(isSv?esc(m.iface):esc(m.voltage))+'）の互換候補</div>';
 if(chain.length){h+='<div class="succ"><div class="cmphead" style="color:#4CAF7D">✓ メーカー指定の後継機種</div><div class="mono" style="font-size:12px;color:#E8ECEF">'+esc(m.model)+' → '+chain.map(function(s){return esc(s.model);}).join(" → ")+'</div></div>';}
 h+='<div class="cnt">同一容量クラスで '+comps.length+' 件。'+(isSv?"★指令I/F一致を優先表示。他メーカーはモータ・ケーブルのセット交換が前提。":("★寸法・端子"+(isVec?"・PG・パラメータ":"・パラメータ")+"は要現物確認。"))+'</div>';
 if(!comps.length){h+='<div class="empty">同一容量クラスの互換候補が見つかりませんでした。</div>';}
 else{h+=comps.map(function(c){
  var badge=(c.isSuccessor?'<span class="badge b-ok">後継</span>':"")+(c.anchor?'<span class="badge b-ok">●公式確認</span>':"");
  var s='<div class="card" style="border-color:'+(c.isSuccessor?"#2E5E3F":"#354352")+';margin-bottom:10px;padding:14px">';
  s+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div style="min-width:0"><div class="mono" style="font-size:15px;font-weight:700">'+esc(c.model)+badge+'</div><div style="font-size:11px;color:#8A99A8;margin-top:2px">'+esc(c.maker)+'・'+esc(c.series)+'</div></div>';
  s+='<div class="mono" style="font-size:12px;color:#8A99A8;text-align:right;flex-shrink:0">'+(isSv?(esc(c.ratedLabel)+'<br>'+esc(c.voltage)):(c.ratedKW+'kW / '+(c.ratedA?c.ratedA+"A":"-")))+'</div></div>';
  if(isVec)s+=modesHtml(c.controlModes);
  s+='<div class="chips" style="margin-top:8px">';
  if(isSv){s+=tag(c.ifaceMatch,c.ifaceMatch?"指令I/F一致":"I/F違い")+tag(c.sameMaker,c.sameMaker?"同一メーカー":"他メーカー(要セット交換)",!c.sameMaker)+tag(c.holeMatch,c.holeMatch?"取付穴一致":"取付穴違い("+c.holes.w+"×"+c.holes.h+")")+tag(c.diff===0,c.diff===0?"外形同一":"外形差 約"+Math.round(c.diff)+"mm");}
  else{if(isVec)s+=tag(c.pgMatch,c.pgMatch?"PG系同一":"PGオプション違い");s+=tag(c.holeMatch,c.holeMatch?"取付穴一致":"取付穴違い("+c.holes.w+"×"+c.holes.h+")")+tag(c.diff===0,c.diff===0?"外形同一":"外形差 約"+Math.round(c.diff)+"mm")+tag(c.sameMaker,c.sameMaker?"同一メーカー":"他メーカー",!c.sameMaker);}
  s+='</div>';
  if(isSv)s+=servoCompare(m,c);
  else{if(isVec)s+=pgCompare(m,c);s+=wiringCompare(m,c,isVec);}
  s+='</div>';return s;
 }).join("");}
 h+='<button class="ghost" style="width:100%;margin-top:16px" onclick="go(\'search\')">↺ 別の機種を検索</button>';
 return h;
}
function footer(){
 if(S.cat==="servo"){
  return '<div class="foot"><b>データについて</b><br>三菱 MR-J5（-G/-B/-A/-G-N1）、安川 Σ-7 SGD7S・Σ-X（EtherCAT）はメーカー公式で確認。パナ MINAS A6／オムロン 1S／富士 ALPHA7／サンヨー SANMOTION R は代表構成。日本リライアンス（現REJ）VZ7000 は SERCOS標準・1.5kW〜600kW・エンコーダ1,000,000p/rev をREJ公式で確認（外形寸法のみ代表値）。安川 生産中止ACサーボパックと推奨代替は安川 e-メカサイトより収録（フィルタ「生産中止・代替参照」で一覧）。<b>サーボはアンプ＋モータ＋エンコーダ＋専用ケーブルが一体の適合セット</b>で、他メーカー単体置換は不可。選定前に必ず各社カタログ・現物銘板で検証してください。</div>';
 }
 return '<div class="foot"><b>データについて</b><br>富士 FRENIC-Ace(E3)・FRENIC-VG、三菱 FR-A800、オムロン 3G3MX2/RX2 の型式はメーカー公式で確認。日本リライアンス（現REJ）は Drive MuLti（現行, 通信AMX/GV-NET標準）・VZ3000 / BL3000（旧）を系列確認のうえ収録（容量帯・寸法・端子・パラメータは代表値）。外形寸法・取付穴・制御端子・パラメータ番号は機種ごとに差異があるため、交換前に必ず各社カタログ・取扱説明書PDFと現物銘板で検証してください。ベクトル制御機はモータ定数のオートチューニングとPGパルス設定が必須です。</div>';
}

/* ================= マウント & イベント ================= */
function render(){
 var app=document.getElementById("app");
 var body;
 if(S.step==="search")body=viewSearch();
 else if(S.step==="confirm")body=viewConfirm();
 else body=viewResult();
 app.innerHTML=body+footer();
 if(S.step==="search"){updateResults();var q=document.getElementById("q");if(q&&document.activeElement!==q){/* keep */}}
 window.scrollTo(0,0);
}
function updateResults(){var r=document.getElementById("results");if(r)r.innerHTML=resultItems();}
function onInput(val){S.query=val;updateResults();}
function setCat(c){if(S.cat===c)return;S.cat=c;S.step="search";S.matchedId=null;S.query="";S.maker="すべて";S.volt=0;S.iface="すべて";render();}
function setInvType(t){if(S.invType===t)return;S.invType=t;S.step="search";S.matchedId=null;S.query="";S.maker="すべて";S.volt=0;render();}
function setMaker(v){S.maker=v;render();}
function setVolt(v){S.volt=v;render();}
function setIface(v){S.iface=v;render();}
function pick(id){S.matchedId=id;S.step="confirm";render();}
function go(step){if(step==="search"){S.matchedId=(step==="search"?S.matchedId:S.matchedId);}S.step=step;if(step==="search")S.matchedId=null;render();}
function searchAlt(){var m=byId(S.matchedId);S.query="";S.maker="安川電機";S.volt=0;S.iface="すべて";S.step="search";S.matchedId=null;render();}
window.setCat=setCat;window.setInvType=setInvType;window.setMaker=setMaker;window.setVolt=setVolt;window.setIface=setIface;
window.onInput=onInput;window.pick=pick;window.go=go;window.searchAlt=searchAlt;
render();
</script>
</body>
