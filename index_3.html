<title>センサー互換サーチ</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#151C24;color:#E8ECEF;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.panel{background:#1E2833;border:1px solid #354352}
.amber{color:#E8A33D}.green{color:#4CAF7D}.gray{color:#8A99A8}
header{border-bottom:1px solid #354352;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
.wrap{padding:16px;max-width:780px;margin:0 auto}
input{width:100%;padding:13px 12px;background:#151C24;border:1px solid #354352;
 border-radius:8px;color:#E8ECEF;font-size:16px;font-family:ui-monospace,Menlo,monospace}
input:focus{outline:2px solid #E8A33D}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;background:#E8A33D;color:#151C24;border:none;
 border-radius:8px;font-weight:700;font-size:15px;margin-top:10px}
.chip{padding:9px 13px;border-radius:8px;border:1px solid #354352;background:#151C24;
 color:#E8ECEF;font-size:13px;font-weight:600}
.chip.on{border-color:#E8A33D;background:#2A2418;color:#E8A33D}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sug{border:1px solid #354352;border-radius:8px;overflow:hidden;margin-top:8px}
.sug button{display:block;width:100%;text-align:left;padding:11px 12px;background:#151C24;
 border:none;border-bottom:1px solid #232E3A;color:#E8ECEF}
.sug button:last-child{border-bottom:none}
.sug .m{font-size:14px;font-family:ui-monospace,Menlo,monospace}
.sug .s{font-size:11px;color:#8A99A8;margin-top:3px}
.card{background:#1E2833;border:1px solid #354352;border-radius:8px;padding:14px;margin-bottom:10px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:4px;margin:3px 4px 0 0;
 font-family:ui-monospace,Menlo,monospace}
.ok{background:rgba(76,175,125,.12);color:#4CAF7D;border:1px solid #3A6B52}
.ng{background:rgba(232,163,61,.12);color:#E8A33D;border:1px solid #7A5A2E}
.spec{background:#151C24;border:1px solid #354352;border-radius:8px;padding:10px 12px}
.spec .l{font-size:11px;color:#8A99A8}
.spec .v{font-size:15px;font-weight:600;margin-top:2px;font-family:ui-monospace,Menlo,monospace}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.warn{background:rgba(232,163,61,.08);border:1px solid #7A5A2E;border-radius:8px;
 padding:11px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.back{background:none;border:none;color:#8A99A8;font-size:13px;padding:0;margin-bottom:12px}
.steps{display:flex;padding:14px 16px 0;max-width:780px;margin:0 auto}
.steps>div{display:flex;align-items:center;flex:1}
.sn{width:25px;height:25px;border-radius:5px;display:flex;align-items:center;justify-content:center;
 font-size:12px;font-weight:700;background:#2A3644;color:#8A99A8;font-family:ui-monospace,monospace}
.sn.on{background:#E8A33D;color:#151C24}
.sl{font-size:11.5px;margin-left:7px}
.bar{flex:1;height:1px;background:#354352;margin:0 10px}
.acc{width:100%;background:none;border:none;color:#E8ECEF;font-size:14px;font-weight:700;
 padding:14px 0 0;border-top:1px solid #354352;margin-top:18px;display:flex;justify-content:space-between}
.wt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 8px;font-size:12px;margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.small{font-size:11px;color:#5A6675;line-height:1.65;margin-top:16px}
</style>
</head>

<header>

  </div>
</header>
<div class="steps" id="steps"></div>
<div class="wrap" id="app"></div>

100,"d":50},"capacityClass":"PX-SEJ-70mm","mounting":"ブラケット型","cableColors":{"plus":"茶","minus":"青","out":"黒"},"tempMax":70,"verified":true,"note":"□50x□100・アルミダイキャスト・感度調整可(9809-0300/0400/0500と同系)"},{"id":"SEJ-OSA67305G","maker":"SEJ","model":"OSA 673.05 G","category":"special","ratedA":0,"detectMethod":"HMD(熱間金属検出)","voltage":"AC/DC(2線)","outputSpec":"N.O.","dims":{"w":57,"h":150,"d":57},"capacityClass":"SP-HMD","mounting":"ブラケット取付","tempMax":75,"verified":true,"note":"熱間金属検出・反応380℃以上(OSA674.05Gは450℃)・鉄鋼設備の熱間材位置検出用・ステンレス"},{"id":"SEJ-98000159","maker":"SEJ","model":"9800-0159","category":"proximity","ratedA":0,"threadSize":"リング","voltage":"⚠要確認","outputSpec":"⚠要確認","dims":{"w":60,"h":60,"d":40},"capacityClass":"PX-SEJリング","mounting":"ブラケット型","tempMax":70,"verified":false,"note":"リングセンサ。リング内を通過する物体を検出。⚠動作距離・電源・出力は要メーカー確認"}];
document.getElementById('cnt').textContent = DEVICES.length;

const CAT={proximity:{label:'近接スイッチ',pl:'検出距離'},photo:{label:'フォトスイッチ',pl:'検出距離'},
 ultrasonic:{label:'超音波センサ',pl:'検出距離'},special:{label:'特殊(熱間/光学/導光)',pl:'検出仕様'}};
const MOUNT={proximity:['ねじ込み型','ブラケット型'],photo:['ブラケット取付','アングル一体型'],
 ultrasonic:['ブラケット取付','ねじ込み型'],special:['ブラケット取付','ねじ込み型']};
const REL={限定反射形:['距離設定形'],距離設定形:['限定反射形']};
const HEX={茶:'#8B5A2B',青:'#2A6FDB',黒:'#1A1A1A',白:'#F2F2F2',赤:'#D9463D'};
const MAKERS=[...new Set(DEVICES.map(d=>d.maker))];

const norm=s=>(s||'').replace(/[\s\-\.]/g,'').toLowerCase();
const wireCount=d=>{const s=(d.outputSpec||'')+' '+(d.voltage||'');
  return s.includes('3線')?3:s.includes('2線')?2:null;};
const methodOK=(a,b)=>a===b||(REL[b]||[]).includes(a);
function dist(d){const v=d.ratedA;if(!v||v<=0)return'―';
  if(v>=1000){const m=v/1000;return(Number.isInteger(m)?m:m.toFixed(1))+'m'}return v+'mm'}
const temp=d=>d&&d.tempMax?'～'+d.tempMax+'℃':'―';
const sub=d=>d.category==='proximity'?(d.threadSize||'―'):(d.detectMethod||'―');
const dimDiff=(a,b)=>Math.abs(a.w-b.w)+Math.abs(a.h-b.h)+Math.abs(a.d-b.d);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S={step:1,q:'',cat:'proximity',maker:MAKERS[0],matched:null,mount:'',
  browse:false,notFound:false,open:{}};

function successors(d){const c=[];let cur=d;const seen=new Set([cur.id]);
  while(cur.successorId){const n=DEVICES.find(x=>x.id===cur.successorId);
    if(!n||seen.has(n.id))break;c.push(n);seen.add(n.id);cur=n}return c}

function compat(){const m=S.matched;if(!m)return[];const mt=S.mount||m.mounting;
  const wm=wireCount(m);
  return DEVICES.filter(a=>{
    if(a.category!==m.category||a.id===m.id)return false;
    const wa=wireCount(a);if(wm&&wa&&wm!==wa)return false;
    if(a.id===m.successorId)return true;
    if(a.capacityClass===m.capacityClass)return true;
    if(a.compatGroup&&a.compatGroup===m.compatGroup){
      if(m.category==='proximity')return a.threadSize===m.threadSize;
      return methodOK(a.detectMethod,m.detectMethod)}
    return false;
  }).map(a=>({...a,diff:dimDiff(a.dims,m.dims),
    mountOK:a.mounting===mt,outOK:!m.outputSpec||a.outputSpec===m.outputSpec,
    methodOK:!m.detectMethod||methodOK(a.detectMethod,m.detectMethod),
    threadOK:!m.threadSize||a.threadSize===m.threadSize,
    succ:a.id===m.successorId,
    tempDown:!!(m.tempMax&&a.tempMax&&a.tempMax<m.tempMax),
    dr:(m.ratedA>0&&a.ratedA>0)?Math.abs(Math.log10(a.ratedA/m.ratedA)):99}))
  .sort((a,b)=>{
    if(a.succ!==b.succ)return a.succ?-1:1;
    if(a.methodOK!==b.methodOK)return a.methodOK?-1:1;
    if(a.threadOK!==b.threadOK)return a.threadOK?-1:1;
    if(Math.abs(a.dr-b.dr)>.01)return a.dr-b.dr;
    if(a.tempDown!==b.tempDown)return a.tempDown?1:-1;
    if(a.mountOK!==b.mountOK)return a.mountOK?-1:1;
    if(a.outOK!==b.outOK)return a.outOK?-1:1;
    return a.diff-b.diff})}

function pick(id){const d=DEVICES.find(x=>x.id===id);if(!d)return;
  S.matched=d;S.cat=d.category;S.maker=d.maker;S.mount=d.mounting||'';
  S.notFound=false;S.browse=false;S.step=2;S.open={};render();window.scrollTo(0,0)}

function search(){const q=norm(S.q);if(!q)return;
  const ex=DEVICES.find(c=>norm(c.model)===q);if(ex)return pick(ex.id);
  const pa=DEVICES.filter(c=>norm(c.model).includes(q));
  if(pa.length===1)return pick(pa[0].id);
  S.notFound=true;S.matched=null;S.browse=true;render()}

function reset(){S={step:1,q:'',cat:'proximity',maker:MAKERS[0],matched:null,mount:'',
  browse:false,notFound:false,open:{}};render();window.scrollTo(0,0)}

// 【重要】iOS Safari対策:入力中は候補リストのみ差し替え(全体再描画で文字が重複するため)
function onInput(v){S.q=v;S.notFound=false;
  const el=document.getElementById('sug');if(el)el.innerHTML=sugHTML()}

function sugHTML(){
  if(norm(S.q).length<2)return'';
  const list=DEVICES.filter(d=>norm(d.model).includes(norm(S.q))).slice(0,12);
  if(!list.length)return'';
  return '<div class="sug">'+list.map(c=>
    '<button onclick="pick(\''+c.id+'\')"><div class="m">'+esc(c.model)+
    (c.discontinued?' <span style="font-size:11px;color:#8A99A8">(終了)</span>':'')+'</div>'+
    '<div class="s">'+esc(c.maker)+'・'+esc(CAT[c.category].label)+'・'+esc(sub(c))+' '+dist(c)+
    (c.tempMax?'・'+temp(c):'')+'</div></button>').join('')+'</div>'}

function wiring(o,n){
  if(!o.cableColors||!n.cableColors)return'';
  const F=[['plus','+V(電源)'],['minus','0V(コモン)'],['out','出力']];
  const rows=F.map(([k,l])=>({k,l,o:o.cableColors[k],n:n.cableColors[k]})).filter(r=>r.o||r.n);
  const ch=rows.filter(r=>r.o&&r.n&&r.o!==r.n).length;
  const dot=c=>c?'<span class="dot" style="background:'+(HEX[c]||'#8A99A8')+
    (c==='白'?';border:1px solid #8A99A8':'')+'"></span>'+c:'―';
  return '<div style="margin-top:10px;padding:11px;background:#151C24;border:1px solid #354352;border-radius:8px">'+
   '<div style="font-size:12px;font-weight:700;margin-bottom:7px;color:'+(ch?'#E8A33D':'#4CAF7D')+'">'+
   (ch?'⚠ 電線の被覆色が '+ch+' 箇所で異なります。結線前に現物の色を確認してください。'
      :'✓ 電線の被覆色は既設品と同一です。')+'</div><div class="wt">'+
   '<div class="gray mono">電線</div><div class="gray mono">既設</div><div class="gray mono">交換後</div>'+
   rows.map(r=>{const c=r.o&&r.n&&r.o!==r.n;
     return '<div>'+r.l+'</div><div class="mono" style="color:'+(c?'#E8A33D':'#8A99A8')+'">'+dot(r.o)+
     '</div><div class="mono" style="color:'+(c?'#E8A33D':'#4CAF7D')+';font-weight:'+(c?700:400)+'">'+
     dot(r.n)+(c?' ←変更':'')+'</div>'}).join('')+'</div></div>'}

function render(){
  document.getElementById('steps').innerHTML=[[1,'型式を検索'],[2,'仕様を確認'],[3,'互換品を表示']]
    .map(([n,l],i)=>'<div><div class="sn'+(S.step>=n?' on':'')+'">'+n+'</div>'+
    '<div class="sl" style="color:'+(S.step>=n?'#E8ECEF':'#8A99A8')+'">'+l+'</div>'+
    (i<2?'<div class="bar"></div>':'')+'</div>').join('');
  const a=document.getElementById('app');
  if(S.step===1)a.innerHTML=view1();
  else if(S.step===2)a.innerHTML=view2();
  else a.innerHTML=view3();
}

function view1(){
  const cands=DEVICES.filter(d=>d.category===S.cat&&d.maker===S.maker);
  return '<div class="panel" style="border-radius:10px;padding:16px">'+
  '<div style="font-size:14px;font-weight:700">① 型式で検索</div>'+
  '<div class="gray" style="font-size:12.5px;margin:4px 0 10px">既設品の型式を入力(全メーカー・全区分から検索)</div>'+
  '<input id="q" value="'+esc(S.q)+'" placeholder="例: E3Z-D61 / E2E-X4D1 / PL1-30FA" '+
  'oninput="onInput(this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();search()}" '+
  'autocapitalize="characters" autocorrect="off" spellcheck="false">'+
  '<div id="sug">'+sugHTML()+'</div>'+
  '<button class="btn" onclick="search()">検索</button>'+
  (S.notFound?'<div class="amber" style="font-size:13px;margin-top:11px;line-height:1.6">⚠ 「<span class="mono">'+
    esc(S.q)+'</span>」に一致する型式が見つかりません。下の②で絞り込んでください。</div>':'')+
  '<button class="acc" onclick="S.browse=!S.browse;render()"><span>② 区分・メーカーから探す</span>'+
  '<span class="mono amber" style="font-size:12px">'+(S.browse?'閉じる ▲':'開く ▼')+'</span></button>'+
  (S.browse?'<div style="margin-top:13px">'+
    '<div class="gray" style="font-size:12px;margin-bottom:6px">区分</div><div class="row">'+
    Object.entries(CAT).map(([v,m])=>'<button class="chip'+(S.cat===v?' on':'')+
      '" style="flex:1 1 auto;min-width:110px" onclick="S.cat=\''+v+'\';if(!DEVICES.some(d=>d.category===\''+v+
      '\'&&d.maker===S.maker)){S.maker=MAKERS.find(m=>DEVICES.some(d=>d.category===\''+v+
      '\'&&d.maker===m))}render()">'+m.label+'</button>').join('')+'</div>'+
    '<div class="gray" style="font-size:12px;margin:13px 0 6px">メーカー</div><div class="row">'+
    MAKERS.filter(m=>DEVICES.some(d=>d.category===S.cat&&d.maker===m))
      .map(m=>'<button class="chip'+(S.maker===m?' on':'')+'" onclick="S.maker=\''+m+
      '\';render()">'+esc(m)+'</button>').join('')+'</div>'+
    '<div class="gray" style="font-size:12px;margin:13px 0 6px;display:flex;justify-content:space-between">'+
    '<span>型式(タップで確認へ)</span><span class="mono">'+cands.length+'件</span></div>'+
    '<div class="row" style="max-height:340px;overflow-y:auto">'+
    (cands.length?cands.map(c=>'<button class="chip" style="text-align:left" onclick="pick(\''+c.id+
      '\')"><div class="mono">'+esc(c.model)+(c.discontinued?' <span style="font-weight:400;color:#8A99A8">(終了)</span>':'')+
      '</div><div style="font-size:10px;font-weight:400;color:#8A99A8">'+esc(sub(c))+' / '+dist(c)+
      (c.verified===false?' ⚠':'')+'</div></button>').join('')
      :'<div class="gray" style="font-size:12px">登録データがありません</div>')+'</div></div>':'')+
  '</div>';
}

function view2(){
  const m=S.matched;const ch=successors(m);
  return '<button class="back" onclick="S.step=1;render()">← 検索に戻る</button>'+
  '<div class="panel" style="border-radius:10px;overflow:hidden">'+
  '<div style="background:#232E3A;padding:9px 15px;font-size:12px;border-bottom:1px solid #354352" class="gray">'+
  'この仕様で間違いありませんか?現物の銘板と照合してください。</div><div style="padding:16px">'+
  '<div class="gray" style="font-size:11px">'+esc(m.maker)+'</div>'+
  '<div class="mono amber" style="font-size:24px;font-weight:700;margin-bottom:14px">'+esc(m.model)+'</div>'+
  (m.verified===false?'<div class="warn">⚠ この型式の値は<b class="amber">代表値(要データシート確認)</b>です。発注前にメーカー仕様書で確定してください。</div>':'')+
  (m.discontinued?'<div class="warn">⚠ <b class="amber">生産終了品</b>です。'+
    (ch.length?'後継:<span class="mono green">'+ch.map(d=>esc(d.model)).join(' → ')+'</span>':'')+'</div>':'')+
  '<div class="grid">'+
  ['<div class="spec"><div class="l">'+CAT[m.category].pl+'</div><div class="v">'+dist(m)+'</div></div>',
   m.detectMethod?'<div class="spec"><div class="l">検出方式</div><div class="v">'+esc(m.detectMethod)+'</div></div>':'',
   m.threadSize?'<div class="spec"><div class="l">サイズ/ねじ径</div><div class="v">'+esc(m.threadSize)+'</div></div>':'',
   m.voltage?'<div class="spec"><div class="l">電源電圧</div><div class="v">'+esc(m.voltage)+'</div></div>':'',
   m.outputSpec?'<div class="spec"><div class="l">出力方式</div><div class="v" style="font-size:13px">'+esc(m.outputSpec)+'</div></div>':'',
   '<div class="spec"><div class="l">使用温度(最高)</div><div class="v">'+temp(m)+'</div></div>',
   '<div class="spec"><div class="l">外形寸法</div><div class="v" style="font-size:13px">'+
     m.dims.w+'×'+m.dims.h+'×'+m.dims.d+'</div></div>'].join('')+'</div>'+
  (m.note?'<div class="gray" style="font-size:11.5px;margin-top:11px;line-height:1.6">※ '+esc(m.note)+'</div>':'')+
  '<div class="gray" style="font-size:12px;margin:15px 0 6px">既設品の取付方式(現物を確認)</div><div class="row">'+
  (MOUNT[m.category]||['ねじ込み型','ブラケット取付']).map(x=>'<button class="chip'+
    ((S.mount||m.mounting)===x?' on':'')+'" style="flex:1" onclick="S.mount=\''+x+'\';render()">'+x+'</button>').join('')+
  '</div><button class="btn" style="background:#4CAF7D;color:#0F1A14" onclick="S.step=3;render();window.scrollTo(0,0)">'+
  '✓ この仕様で互換品を表示</button>'+
  '<button class="btn" style="background:#2A3644;color:#E8ECEF;border:1px solid #354352" onclick="S.step=1;render()">型式を再入力</button>'+
  '</div></div>';
}

function view3(){
  const m=S.matched;const list=compat();
  return '<button class="back" onclick="reset()">← 最初から検索</button>'+
  '<div class="gray" style="font-size:13px;margin-bottom:14px;line-height:1.6"><span class="mono green">'+
  esc(m.model)+'</span>('+CAT[m.category].pl+' '+dist(m)+(m.detectMethod?' / '+esc(m.detectMethod):'')+
  (m.threadSize?' / '+esc(m.threadSize):'')+')の互換品候補 '+list.length+'件</div>'+
  (list.length?list.map((c,i)=>'<div class="card">'+
    '<div style="font-size:11px" class="gray">'+esc(c.maker)+
    (c.succ?' <b class="amber">メーカー後継品</b>':'')+
    (!c.succ&&i===0?' <b class="green">候補No.1</b>':'')+
    (c.maker!==m.maker?' <span style="color:#6FA8DC">他社互換</span>':'')+'</div>'+
    '<div class="mono" style="font-size:17px;font-weight:700">'+esc(c.model)+
    (c.discontinued?' <span style="font-size:11px;font-weight:400" class="gray">(終了)</span>':'')+'</div>'+
    '<div class="gray" style="font-size:12px;margin-top:4px;line-height:1.6">'+CAT[c.category].pl+
    ' <span class="mono">'+dist(c)+'</span>'+(c.verified===false?' <span class="amber">⚠代表値</span>':'')+
    (c.voltage?' / <span class="mono">'+esc(c.voltage)+'</span>':'')+
    (c.tempMax?' / 使用温度 <span class="mono">'+temp(c)+'</span>':'')+
    '<br>外形 <span class="mono">'+c.dims.w+'×'+c.dims.h+'×'+c.dims.d+'mm</span>'+
    (c.diff===0?' <span class="green">(寸法一致)</span>':' <span class="amber">(差Σ'+c.diff+'mm)</span>')+'</div>'+
    '<div style="margin-top:6px">'+
    (m.detectMethod?'<span class="badge '+(c.methodOK?'ok':'ng')+'">'+(c.methodOK?'✓ ':'△ ')+esc(c.detectMethod)+'</span>':'')+
    (m.threadSize?'<span class="badge '+(c.threadOK?'ok':'ng')+'">'+(c.threadOK?'✓ ':'△ ')+esc(c.threadSize)+'</span>':'')+
    '<span class="badge '+(c.mountOK?'ok':'ng')+'">'+(c.mountOK?'✓ ':'△ ')+esc(c.mounting)+'</span>'+
    (m.outputSpec?'<span class="badge '+(c.outOK?'ok':'ng')+'">'+(c.outOK?'✓ ':'△ ')+esc(c.outputSpec)+'</span>':'')+
    (m.tempMax&&c.tempMax?'<span class="badge '+(c.tempDown?'ng':'ok')+'">'+
      (c.tempDown?'△ 使用温度不足 '+temp(c)+'(既設'+temp(m)+')':'✓ 使用温度 '+temp(c))+'</span>':'')+
    '</div>'+
    (c.note?'<div class="gray" style="font-size:11px;margin-top:7px;line-height:1.55">※ '+esc(c.note)+'</div>':'')+
    (m.cableColors&&c.cableColors?'<button class="chip" style="margin-top:9px;color:#E8A33D" onclick="S.open[\''+
      c.id+'\']=!'+(S.open[c.id]?'true':'false')+';render()">'+(S.open[c.id]?'配線色を閉じる':'配線色の変更点を確認')+'</button>'+
      (S.open[c.id]?wiring(m,c):''):'')+
    '</div>').join('')
   :'<div class="card gray" style="font-size:13px">互換候補が登録されていません。</div>')+
  '<div class="small">※ 2線式と3線式で配線本数が異なる機種は候補から除外しています。'+
  '★取付ブラケットの共通性が対応表で裏付けられているのは【オムロンE3Z / パナソニックCX-400 / オプテックスFA Z / キーエンスPZ / 旧山武HPB】の5系統のみです。'+
  '竹中TAKEX・現行アズビルHP7・ifm・北陽電機は「検出方式と距離が近い機能互換」であり取付互換は保証されないため、取付ピッチ・穴径を必ず実測してください。'+
  '検出距離は測定条件(標準検出物体・反射板型式・白画用紙サイズ)で変わります。'+
  '発注・配線前に必ず各社データシートと現物銘板で確認してください。</div>';
}
render();
</script>
</body>
</html>
