<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FA部品 互換サーチ</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="互換サーチ" />
<meta name="theme-color" content="#151C24" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23151C24'/%3E%3Cpolygon points='98 34 54 106 88 106 82 146 126 74 92 74' fill='none' stroke='%23E8A33D' stroke-width='9' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23151C24'/%3E%3Cpolygon points='17 5 9 19 15 19 14 27 23 13 16 13' fill='%23E8A33D'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#151C24; --panel:#1E2833; --line:#354352; --amber:#E8A33D; --green:#4CAF7D;
  --blue:#5B9BD5; --ink:#E8ECEF; --sub:#8A99A8; --dim:#5A6675; --sel:#2A2418; --btn:#2A3644;
  --jp:-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--jp);
  font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;}
/*
 * apple-mobile-web-app-status-bar-style:black-translucent + viewport-fit=cover の
 * 組み合わせでは、ホーム画面から起動したときページが**ステータスバーの下まで**
 * 広がる。上端の余白を取らないと時刻・電波・電池の表示が <h1> に重なるため、
 * 上だけは safe-area の実測値をそのまま入れる（ブラウザでは 0 になる）。
 * env() 非対応の環境では宣言ごと無効になるので、素の余白を先に置いて上書きする。
 * 併せて左右の inset が入れ替わっていたのも直した（横向きで余白が反対側に付く）。
 */
#app{max-width:780px;margin:0 auto;padding:0 12px 24px;}
#app{padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
.mono{font-family:var(--mono);} .amber{color:var(--amber);} .green{color:var(--green);}
a{color:var(--amber);}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none;}
input{font-family:inherit;}
svg{flex-shrink:0;display:block;margin:8px auto 0;}

header{padding:16px 4px 8px;}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em;}
header .sub{color:var(--sub);font-size:12px;}
.sub{color:var(--sub);font-size:12px;}

.steps{display:flex;gap:6px;margin:10px 0 14px;}
.st{flex:1;display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);font-size:11px;min-width:0;}
.st.on{border-color:var(--amber);color:var(--ink);background:var(--sel);}
.st.done{color:var(--sub);}
.sn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid currentColor;font-size:10px;flex-shrink:0;}
.sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;}
.lbl{display:block;color:var(--sub);font-size:12px;margin-bottom:6px;}

/*
 * チップ行は折り返して全件を見せる。
 * 横スクロールにしていたころは、スマホで画面外のカテゴリに気づけなかった
 * （スクロールバーも出ないので、隠れていること自体が分からない）。
 */
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:6px;
  background:var(--btn);border:1px solid var(--line);color:var(--sub);
  font-size:13px;font-weight:600;white-space:nowrap;}
/* カテゴリだけは余白を分け合って行末を揃える（タブらしく見せる） */
.chiprow.cats .chip{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;}
.chip.on{background:var(--sel);border-color:var(--amber);color:var(--amber);}
.chip.sm{font-size:12px;padding:5px 10px;font-weight:400;}
.chip.empty{opacity:.5;}
.chip .cnt{margin-left:6px;font-size:10px;color:var(--dim);font-family:var(--mono);}
.chip.on .cnt{color:var(--amber);}

.searchbar{display:flex;gap:8px;}
.searchbar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:10px;color:var(--ink);font-size:16px;}
.searchbar input:focus{outline:2px solid var(--amber);}

.btn{padding:10px 14px;border-radius:6px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--btn);}
.btn.primary{background:var(--amber);color:#1A1207;border-color:var(--amber);}
.btn.ghost{background:transparent;color:var(--sub);}
.btn.wide{display:block;width:100%;margin-top:8px;}

.rows{display:flex;flex-direction:column;gap:4px;}
.rows.scroll{max-height:340px;overflow-y:auto;}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
  padding:8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);}
/* JUSP-NS100/NS110/... のような区切りの無い長い型式でも枠から出さない */
.row-main{font-size:14px;overflow-wrap:anywhere;} .row-sub{color:var(--sub);font-size:11px;}
#sug:not(:empty){display:flex;flex-direction:column;gap:4px;margin-top:8px;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.maker{color:var(--sub);font-size:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.model{font-size:16px;font-weight:600;overflow-wrap:anywhere;} .model.big{font-size:19px;}
.card-right{text-align:right;flex-shrink:0;}
.primary-spec{font-size:15px;color:var(--amber);}
.dim-verdict{font-size:11px;display:block;}
.dim-verdict.ok{color:var(--green);} .dim-verdict.warn{color:var(--amber);} .dim-verdict.dim{color:var(--dim);}

.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.badge{font-size:10px;padding:2px 7px;border-radius:4px;font-family:var(--mono);
  border:1px solid var(--line);color:var(--sub);white-space:nowrap;}
.ev-ok{color:var(--green);border-color:#2E5C45;background:rgba(76,175,125,.10);}
.ev-warn{color:var(--amber);border-color:#7A5A2E;background:rgba(232,163,61,.10);}
.ev-dim{color:var(--dim);}
.b-disc{color:var(--amber);border-color:#7A5A2E;}
.b-succ{color:var(--amber);border-color:var(--amber);background:var(--sel);}
.b-cross{color:var(--blue);border-color:#3A5B7A;background:rgba(91,155,213,.10);}
.b-scope{color:var(--blue);border-color:#3A5B7A;}
.b-exact{color:var(--green);border-color:#2E5C45;background:rgba(76,175,125,.10);}
.ev-note{margin-left:5px;opacity:.75;}
.evidence{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.spec{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0;}
.spec .l{color:var(--sub);font-size:10px;}
.spec .v{font-size:13px;overflow-wrap:anywhere;}

.cmp{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding:8px 10px;border-radius:6px;
  border:1px solid var(--line);background:var(--bg);font-size:12px;}
.cmp b{font-size:11px;color:var(--sub);font-weight:600;}
.cmp-ok{border-left:3px solid var(--green);}
.cmp-warn{border-left:3px solid var(--amber);}
.cmp-info{border-left:3px solid var(--blue);}

.warn{margin-top:8px;padding:9px 10px;border-radius:6px;font-size:12px;
  background:rgba(232,163,61,.08);border:1px solid #7A5A2E;}
.warn div + div{margin-top:4px;}
.note{margin-top:8px;padding:7px 9px;border-radius:6px;background:var(--bg);
  border:1px solid var(--line);font-size:12px;color:var(--sub);overflow-wrap:anywhere;}
.dim-none{margin-top:10px;color:var(--dim);font-size:12px;text-align:center;}
.empty-note{font-size:13px;} .empty-note div{color:var(--sub);font-size:12px;margin-top:6px;}
.result-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;}
.foot{color:var(--dim);font-size:11px;text-align:center;padding:8px 4px 0;}

/* iPhone 標準幅(390px)が主対象。ステップ名を消すと空箱になるので縮めて残す */
@media (max-width:420px){
  .grid{grid-template-columns:1fr;}
  .st{padding:6px;gap:4px;}
  .sl{font-size:10px;}
  .chiprow.cats .chip{padding:6px 9px;font-size:12px;}
}
@media (max-width:340px){ .sl{display:none;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ===== core/util.mjs ===== */
/** 3アプリに重複していた汎用ユーティリティ。ここが唯一の実装。 */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
}

/**
 * 型式検索用の正規化は2段ある。用途を取り違えると容量を取り違える。
 *
 * - normLoose … 候補を「集める」ための綴り。空白・ハイフン・小数点を落とす。
 *   うろ覚えの入力（S-N10 を SN10、I-210.31 を I21031）を拾うために緩くする。
 * - normExact … 候補を「見分ける」ための綴り。小数点は残す。
 *
 * 小数点を落とすと FR-E820-1.5K-1（1.5kW）と FR-E820-15K-1（15kW）が同じ綴りに
 * なる。10倍の取り違えは誤発注に直結するので、識別に loose を使ってはいけない。
 * 逆に収集を exact にすると、ドットを省いた入力が引けなくなる（型式にドットを
 * 含むレコードは131件ある）うえ、「1.5K のつもりで打った綴り」が 15K と完全一致
 * してしまい、曖昧一致リストを経由せず黙って別容量を掴む。
 *
 * したがって collect は loose、identify は exact と役割を分ける。
 */
function normLoose(s) {
  return (s || '').replace(/[\s\-.]/g, '').toLowerCase();
}

function normExact(s) {
  return (s || '').replace(/[\s\-]/g, '').toLowerCase();
}

/** 外形寸法の差（マンハッタン距離, mm）。どちらか欠けていれば null。 */
function dimDiff(a, b) {
  if (!a || !b) return null;
  return Math.abs(a.w - b.w) + Math.abs(a.h - b.h) + Math.abs(a.d - b.d);
}

/** 後継品の連鎖。循環は seen で止める。 */
function successorChain(device, byId) {
  const chain = [];
  const seen = new Set([device.id]);
  let cur = device;
  while (cur.successorId) {
    const next = byId.get(cur.successorId);
    if (!next || seen.has(next.id)) break;
    chain.push(next);
    seen.add(next.id);
    cur = next;
  }
  return chain;
}

/**
 * 取付方式の語彙正規化。
 *
 * 移行元では同義語が併存していた（proximity のみ「ブラケット型」、他は「ブラケット取付」）。
 * 統合後は1アプリ内に同居するため、コア側で正規化する。
 */
const MOUNTING_SYNONYMS = {
  'ブラケット型': 'ブラケット取付',
};

function normalizeMounting(v) {
  if (!v) return v;
  return MOUNTING_SYNONYMS[v] || v;
}

/**
 * 選択肢は固定配列ではなく実データから導出する。
 *
 * 移行元では固定配列と実データがずれており、index.html の「接触器直付」（サーマル47件）と
 * index_3.html の「ねじ込み型」（光電4件）が選択肢に無く、どのボタンも選択状態に
 * ならないうえ、押すと全候補の取付一致が false になる不具合があった。
 * 実データから導出すればこの種のずれは構造的に起きない。
 */
function mountingOptions(devices) {
  const seen = [];
  for (const d of devices) {
    const m = normalizeMounting(d.mounting);
    if (m && !seen.includes(m)) seen.push(m);
  }
  return seen;
}

/** 数値を短く整形（12.0 → 12, 2.20 → 2.2） */
function num(v) {
  if (v == null) return '';
  return Number.isInteger(v) ? String(v) : String(Number(v.toFixed(3)));
}


/* ===== core/store.mjs ===== */
/** デバイスとカテゴリの保管庫。ブラウザでもNodeテストでも同じものを使う。 */

const store = {
  devices: [],
  byId: new Map(),
  reference: { makers: [] },
};

/**
 * data/**.json のレコードを読み込む。
 *
 * provisional（実在未確認）は既定で候補にも検索にも出さない。判定はホワイトリスト
 * （catalog-confirmed だけを通す）なので、modelStatus の付け忘れや綴り間違いも
 * ここで落ちる。黙って消えると原因が追いにくいため、混入は build.mjs が
 * ビルド時に検出して失敗させる。
 */
function loadDevices(list, reference) {
  const usable = list.filter((d) => d.modelStatus === 'catalog-confirmed');
  store.devices = usable.map((d) => ({ ...d, mounting: normalizeMounting(d.mounting) }));
  store.byId = new Map(store.devices.map((d) => [d.id, d]));
  if (reference) store.reference = reference;
  return store;
}

function devicesOf(categoryId) {
  return store.devices.filter((d) => d.category === categoryId);
}

function makersOf(categoryId) {
  const seen = [];
  for (const d of devicesOf(categoryId)) if (!seen.includes(d.maker)) seen.push(d.maker);
  return seen;
}


/* ===== core/registry.mjs ===== */
/**
 * カテゴリレジストリ。
 *
 * カテゴリ追加は data/<id>.json と src/categories/<id>.mjs の2ファイル追加＋
 * ここへの登録だけで完結し、コアもHTMLも変更しない。
 */
const categories = [];

/**
 * @param {object} def
 *   id, label            … 識別子と表示名
 *   group                … 並び順のグルーピング。UIの階層には使わない
 *   specDefs             … カテゴリ固有スペックの宣言（単位・書式・距離関数）
 *   gate(a, m)           … a を m の候補に入れてよいか
 *   rank(a, b, m)        … 候補の並び順
 *   enrich(a, m)         … バッジ用の派生値（任意）
 *   summary(d)           … 確認画面のスペック欄（任意）
 *   detailPanels(m, c)   … カテゴリ固有の詳細比較（任意）
 *   emptyNote(m)         … 候補0件のときの説明（任意・HTML）
 */
function registerCategory(def) {
  if (!def.id || !def.label) throw new Error('カテゴリには id と label が必要です');
  if (categories.some((c) => c.id === def.id)) throw new Error(`カテゴリ重複: ${def.id}`);
  categories.push({ enrich: () => ({}), summary: () => [], detailPanels: () => [], emptyNote: () => '', specDefs: [], ...def });
  return def;
}

/** 登録順＝表示順 */
function allCategories() {
  return categories.slice();
}

function getCategory(id) {
  return categories.find((c) => c.id === id);
}

/** そのカテゴリの主スペック（確認画面や候補カードの見出しに使う） */
function primarySpec(category) {
  return category.specDefs.find((s) => s.primary) || category.specDefs[0] || null;
}

/**
 * 候補集合の中で値が割れているスペックを1つ選ぶ。
 *
 * 曖昧一致リストは「取り違えを防ぐため選んでください」と言う以上、見分ける材料を
 * 出さなければ意味がない。主スペック固定にすると、その値が未登録のカテゴリで
 * 全行が「―」になり、区別できるのが取り違えている型式文字列だけになる
 * （インバータは主スペックの定格出力電流が全40件で未登録だった時期があり、
 *   そのあいだ見分ける材料になれるのは適用モータ容量だけだった）。
 * specDefs の宣言順に見て、最初に値が割れたものを返す。宣言順は「見分けやすさ」を
 * 表すので、判定に使う主スペック（primary）が先頭とはかぎらない。インバータは
 * 判定を定格出力電流で行いつつ、識別材料には適用モータ容量を先に出す。
 *
 * 全スペックが同値なら null。呼び出し側は主スペックとメーカー表示に委ねる
 * （S-N10 / SN10 は容量が同じでメーカーが違う、という組がこれにあたる）。
 */
function distinguishingSpec(category, devices) {
  if (!category || devices.length < 2) return null;
  for (const sd of category.specDefs) {
    const seen = new Set(devices.map((d) => JSON.stringify(d.specs?.[sd.key] ?? null)));
    if (seen.size > 1) return sd;
  }
  return null;
}

/** スペック値の表示。値が無ければ「―」（旧 ratedA:0 センチネルの置き換え） */
function formatSpecValue(specDef, v) {
  if (!specDef || v == null) return '―';
  return specDef.format ? specDef.format(v) : `${v}${specDef.unit || ''}`;
}

/** デバイスのスペック値の表示。キーが無ければ「―」 */
function formatSpec(specDef, device) {
  return formatSpecValue(specDef, specDef ? device.specs?.[specDef.key] : null);
}


/* ===== core/compat.mjs ===== */
/** カテゴリ非依存の互換判定の枠組み: gate → enrich → rank */

/**
 * 容量帯の一致判定（±ratio の窓）。
 *
 * 移行元 index.html:328 は `Math.abs(a-m) <= m*0.3` と **m 基準の非対称**で、
 * A→B が候補でも B→A が候補にならないことがあった。ここでは大きい方を基準に
 * することで対称にする（どちらから引いても同じ結果になる）。
 * 検索の性質上、取りこぼしより1件多く見せるほうが安全なので max を採る。
 */
function withinWindow(a, b, ratio) {
  if (a == null || b == null) return false;
  return Math.abs(a - b) <= Math.max(a, b) * ratio;
}

/** 桁で広がる量（検出距離など）の距離。対数比なので元から対称。 */
function logRatio(a, b) {
  if (!a || !b || a <= 0 || b <= 0) return null;
  return Math.abs(Math.log10(a / b));
}

/** 区間の重なり率。狭いほうの幅で正規化するので、包含関係なら 1.0。 */
function rangeOverlap(a, b) {
  if (!a || !b) return 0;
  const lo = Math.max(a.min, b.min);
  const hi = Math.min(a.max, b.max);
  if (hi <= lo) return 0;
  const span = Math.min(a.max - a.min, b.max - b.min);
  return span > 0 ? (hi - lo) / span : 0;
}

/** 取付穴ピッチの一致。寸法が未検証なら断定せず null（?表示）を返す。 */
function holeMatch(a, m, trustworthy) {
  if (!trustworthy) return null;
  if (!a.holes || !m.holes) return null;
  return a.holes.w === m.holes.w && a.holes.h === m.holes.h;
}

/** 寸法を信用してよいか（両側の evidence.dims が verified のときだけ） */
function dimsTrustworthy(a, m) {
  return a.evidence?.dims?.state === 'verified' && m.evidence?.dims?.state === 'verified' && !!a.dims && !!m.dims;
}

/** 比較用ヘルパー: true を先に */
function preferTrue(a, b) {
  if (a === b) return 0;
  return a ? -1 : 1;
}

/** 比較用ヘルパー: 小さい値を先に。null は最後。 */
function ascending(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  return a - b;
}

/**
 * 候補の算出。
 * @param m        基準デバイス
 * @param category カテゴリモジュール
 * @param ctx      { mounting } 利用者が選んだ取付方式など
 */
function computeCompatibles(m, category, ctx = {}) {
  const wanted = normalizeMounting(ctx.mounting) || m.mounting;

  // シリーズ単位のレコード（型式マスク）は個別の発注可能型式ではないので、
  // 基準にも候補にもしない。カテゴリ側で毎回書くと1つ忘れた時点で穴が開くため、
  // ratedA:0 の番兵ガードと同じ轍を踏まないようここで一度だけ落とす。
  if (isSeriesScope(m)) return [];

  const enriched = devicesOf(m.category)
    .filter((a) => a.id !== m.id && !isSeriesScope(a) && category.gate(a, m, ctx))
    .map((a) => {
      const trustworthy = dimsTrustworthy(a, m);
      return {
        ...a,
        isSuccessor: a.id === m.successorId,
        sameMaker: a.maker === m.maker,
        mountingMatch: a.mounting === wanted,
        dimsTrustworthy: trustworthy,
        holeMatch: holeMatch(a, m, trustworthy),
        diff: trustworthy ? dimDiff(a.dims, m.dims) : null,
        ...category.enrich(a, m, ctx),
      };
    });

  enriched.sort((a, b) => category.rank(a, b, m, ctx));
  return enriched;
}

/** シリーズ単位のマスク（`SGDM / SGDH` や `CACR-SR□□BB`）かどうか */
function isSeriesScope(d) {
  return d?.modelScope === 'series';
}

/** 型式から1件引く。曖昧な場合の扱いは呼び出し側に委ねる。 */
function findById(id) {
  return store.byId.get(id) || null;
}


/* ===== core/evidence.mjs ===== */
/**
 * 検証状態（evidence）の解決と表示。
 *
 * 移行元は unverified / dimVerified / specVerified / rangeVerified / verified /
 * anchor の6フラグに分かれ、しかも極性が逆のものが混在していた。ここでは
 * 側面（model/dims/specs）ごとの3値に統一し、既定は unverified（安全側）とする。
 */

const ASPECTS = ['model', 'dims', 'specs'];

const LABEL = {
  verified: { text: '確認済', cls: 'ev-ok' },
  estimated: { text: '代表値', cls: 'ev-warn' },
  unverified: { text: '未確認', cls: 'ev-dim' },
};

const ASPECT_LABEL = { model: '型式', dims: '寸法', specs: '仕様' };

/** キー欠落は unverified 扱い（安全側に倒す） */
function stateOf(device, aspect) {
  const s = device?.evidence?.[aspect]?.state;
  return LABEL[s] ? s : 'unverified';
}

function isVerified(device, aspect) {
  return stateOf(device, aspect) === 'verified';
}

/** そのレコードで最も弱い側面。カード上の総合表示に使う。 */
function weakestState(device) {
  const order = ['unverified', 'estimated', 'verified'];
  return ASPECTS.map((a) => stateOf(device, a)).sort((x, y) => order.indexOf(x) - order.indexOf(y))[0];
}

/** 並び替え用: verified を先に */
function evidenceRank(device) {
  return { verified: 0, estimated: 1, unverified: 2 }[weakestState(device)];
}

/** 側面ごとのバッジ列（確認画面用）。出典があればリンクにする。 */
function evidenceRow(device) {
  return ASPECTS.map((aspect) => {
    const state = stateOf(device, aspect);
    const src = device?.evidence?.[aspect] || {};
    const label = `${ASPECT_LABEL[aspect]} ${LABEL[state].text}`;
    const inner = src.srcUrl
      ? `<a href="${esc(src.srcUrl)}" target="_blank" rel="noopener">${esc(label)}</a>`
      : esc(label);
    const note = src.srcNote ? `<span class="ev-note">${esc(src.srcNote)}</span>` : '';
    const at = src.checkedAt ? `<span class="ev-note">${esc(src.checkedAt)}</span>` : '';
    return `<span class="badge ${LABEL[state].cls}">${inner}${note}${at}</span>`;
  }).join('');
}

/** 発注前の注意書き。状態に応じて出し分ける。 */
function warningFor(device) {
  const specs = stateOf(device, 'specs');
  const dims = stateOf(device, 'dims');
  const out = [];
  if (specs === 'estimated') {
    out.push('この型式の仕様値は<b class="amber">代表値</b>です。発注前にメーカー仕様書で確定してください。');
  } else if (specs === 'unverified') {
    out.push('この型式の仕様は<b class="amber">未確認</b>です。発注前にメーカー仕様書で確認してください。');
  }
  if (dims !== 'verified') {
    out.push('外形寸法・取付穴ピッチが<b class="amber">未確認</b>のため、寸法比較は行いません。');
  }
  return out;
}


/* ===== core/ui.mjs ===== */
/** 描画部品。3アプリに重複していたウィザード・外形図・バッジをここに集約。 */

function badge(ok, label, neutralLabel) {
  if (ok === null || ok === undefined) return `<span class="badge ev-dim">? ${esc(neutralLabel || label)}</span>`;
  return `<span class="badge ${ok ? 'ev-ok' : 'ev-warn'}">${ok ? '✓' : '△'} ${esc(label)}</span>`;
}

function panelBox({ tone, title, body }) {
  return `<div class="cmp cmp-${tone}"><b>${esc(title)}</b><span>${body}</span></div>`;
}

/** 外形寸法の図。寸法が信用できるときだけ描く。 */
function dimDiagram(dims, holes) {
  if (!dims) return '';
  const scale = Math.min(1.6, 180 / Math.max(dims.h, dims.w, 1));
  const w = dims.w * scale;
  const h = dims.h * scale;
  // 上に穴ピッチと奥行、下に幅、左に高さを置くので上下は非対称に空ける
  const padX = 34;
  const padTop = 40;
  const padBottom = 26;
  // ラベルが収まる最低幅を確保する。細長い部品でも上端の2つのラベルが重ならない。
  const vw = Math.max(w + padX * 2, 260);
  const vh = h + padTop + padBottom;
  const left = (vw - w) / 2; // 本体は常に中央
  let inner = '';
  if (holes) {
    const hw = holes.w * scale;
    const hh = holes.h * scale;
    const hx = left + (w - hw) / 2;
    const hy = padTop + (h - hh) / 2;
    inner =
      `<rect x="${hx}" y="${hy}" width="${hw}" height="${hh}" fill="none" stroke="var(--green)" stroke-width="1.2" stroke-dasharray="4 3"/>` +
      [[hx, hy], [hx + hw, hy], [hx, hy + hh], [hx + hw, hy + hh]]
        .map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="3" fill="var(--green)"/>`).join('') +
      // 本体の外（上端より上）に置いて枠線と重ならないようにする
      `<text x="8" y="14" fill="var(--green)" font-size="11" text-anchor="start">穴 ${num(holes.w)}×${num(holes.h)}mm</text>`;
  }
  // 等倍で描く（width:100% で引き伸ばすと文字だけ巨大になるため）
  return `<svg viewBox="0 0 ${vw} ${vh}" width="${vw}" height="${vh}" style="max-width:100%" role="img" aria-label="外形寸法図">
    <rect x="${left}" y="${padTop}" width="${w}" height="${h}" fill="none" stroke="var(--amber)" stroke-width="1.6"/>
    ${inner}
    <text x="${vw - 8}" y="14" fill="var(--sub)" font-size="11" text-anchor="end">D ${num(dims.d)}mm</text>
    <text x="${vw / 2}" y="${padTop + h + 17}" fill="var(--sub)" font-size="11" text-anchor="middle">W ${num(dims.w)}mm</text>
    <text x="${left - 12}" y="${padTop + h / 2}" fill="var(--sub)" font-size="11" text-anchor="middle" transform="rotate(-90 ${left - 12} ${padTop + h / 2})">H ${num(dims.h)}mm</text>
  </svg>`;
}

/** 生産終了 / メーカー撤退 / 検証状態の見出しバッジ */
function statusBadges(d) {
  let h = '';
  if (d.modelScope === 'series') h += '<span class="badge b-scope">シリーズ単位</span>';
  if (d.discontinued) h += '<span class="badge b-disc">生産終了</span>';
  if (d.makerExited) h += '<span class="badge b-disc">メーカー撤退</span>';
  if (stateOf(d, 'specs') !== 'verified' || stateOf(d, 'dims') !== 'verified') {
    h += '<span class="badge ev-warn">要確認</span>';
  }
  return h;
}

/**
 * シリーズ単位のレコードであることの注意書き。
 *
 * 安川の生産中止一覧は1行が `SGDM / SGDH / SGDP` や `CACR-SR□□BB/BC` という
 * ワイルドカード付きのマスクで、個別の発注可能型式ではない。型式欄をそのまま
 * 発注番号と読まれると誤発注になるため、確認画面で明示する。
 */
function scopeNote(d) {
  if (d.modelScope !== 'series') return '';
  return `<div class="warn"><div>⚠ この行は<b class="amber">シリーズ単位の記載</b>です
    （<span class="mono">□</span> <span class="mono">△</span> は容量などのワイルドカード）。
    個別の発注可能型式ではないので、実機の銘板で型式を確認してください。</div></div>`;
}

/**
 * 生産終了品であることの注意書き。
 *
 * ②の確認画面は型式を最大文字で見せる画面なので、ここに「新規発注できない」と
 * 書かれていなければ、その型式がそのまま発注番号として読まれる。
 * 後継は successorId から byId で解決する（型式名を文面に直書きしない。
 * データ側の後継指定が変われば表示もそのまま追随する）。
 *
 * ここが出すのは「生産終了・新規発注できない・後継は○○」だけで、note は取り込まない。
 * 生産終了品25件のうち note が置換えの条件なのは5件（「置換えに FR-E8AT03 が必要」など）で、
 * 残り20件は仕様説明・来歴・データ品質の注記。全部を ⚠ にすると本当に警告すべき5件と
 * 同じ重みになり、警告そのものが読み流される。note は noteBox が中立の枠で出す。
 */
function discontinuedNote(d, byId) {
  if (!d.discontinued) return '';
  const succ = d.successorId ? byId?.get(d.successorId) : null;
  const succLine = succ ? `後継は <b class="amber mono">${esc(succ.model)}</b> です。` : '';
  return `<div class="warn"><div>⚠ この型式は<b class="amber">生産終了</b>です。
    新規発注はできません。${succLine}</div></div>`;
}

/** デバイスの note。移行元では一度も描画されていなかった。 */
function noteBox(d) {
  if (!d.note) return '';
  return `<div class="note">${esc(d.note)}</div>`;
}

/**
 * 確認画面のスペック欄。
 *
 * 宣言された specDefs を必ず先頭に出し、そのあとにカテゴリ固有の summary を続ける。
 * こうしておくと、カテゴリ側が主スペックを summary に書き忘れても、
 * そのカテゴリの見出しスペック（電流／検出距離／導光路長など）が必ず表示される。
 */
function specGrid(category, d) {
  const declared = category.specDefs
    .map((s) => ({ label: s.label, value: formatSpec(s, d) }))
    // シリーズ単位の行は個別型式の定格を持たない。「― だけの枠」を並べても読めない
    .filter((r) => !(d.modelScope === 'series' && r.value === '―'));
  const rows = [];
  for (const r of [...declared, ...category.summary(d)]) {
    if (rows.some((x) => x.label === r.label)) continue;
    rows.push(r);
  }
  return `<div class="grid">${rows.map((r) =>
    `<div class="spec"><div class="l">${esc(r.label)}</div><div class="v">${esc(r.value)}</div></div>`).join('')}</div>`;
}

/** 候補カード1件 */
function candidateCard(category, m, c, index) {
  const ps = primarySpec(category);
  const lead = c.isSuccessor
    ? '<span class="badge b-succ">メーカー後継品</span>'
    : index === 0 ? '<span class="badge ev-ok">候補No.1</span>' : '';
  const cross = c.sameMaker ? '' : '<span class="badge b-cross">他社互換</span>';

  const dimVerdict = !c.dimsTrustworthy
    ? '<span class="dim-verdict dim">寸法未確認</span>'
    : c.diff === 0 ? '<span class="dim-verdict ok">寸法一致</span>'
    : `<span class="dim-verdict warn">差 Σ${num(c.diff)}mm</span>`;

  const badges = [
    c.holeMatch === null ? badge(null, '取付穴', '取付穴 要検証') : badge(c.holeMatch, '取付穴一致'),
    badge(c.mountingMatch, '取付方式'),
    c.methodMatch !== undefined ? badge(c.methodMatch, '検出方式') : '',
    c.threadMatch !== undefined ? badge(c.threadMatch, 'サイズ/ねじ径') : '',
    c.contactMatch !== undefined ? badge(c.contactMatch, '接点形式(NO/NC)') : '',
    c.outputMatch !== undefined ? badge(c.outputMatch, '出力方式') : '',
    c.tempDown !== undefined ? badge(!c.tempDown, '使用温度') : '',
    c.auxMatch !== undefined ? badge(c.auxMatch, '補助接点') : '',
    c.ifaceMatch !== undefined ? badge(c.ifaceMatch, '指令I/F') : '',
  ].filter(Boolean).join('');

  const panels = category.detailPanels(m, c).map(panelBox).join('');

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="maker">${esc(c.maker)} ${lead}${cross}${statusBadges(c)}</div>
        <div class="model mono">${esc(c.model)}</div>
      </div>
      <div class="card-right">
        <div class="primary-spec mono">${esc(formatSpec(ps, c))}</div>
        ${dimVerdict}
      </div>
    </div>
    <div class="badges">${badges}</div>
    ${noteBox(c)}
    ${panels}
    <div class="evidence">${evidenceRow(c)}</div>
  </div>`;
}

function warningBox(d) {
  const warns = warningFor(d);
  if (!warns.length) return '';
  return `<div class="warn">${warns.map((w) => `<div>⚠ ${w}</div>`).join('')}</div>`;
}


/* ===== core/app.mjs ===== */
/** 状態・画面遷移・イベント。 */

const S = {
  step: 1,
  cat: null,
  q: '',
  maker: 'すべて',
  matchedId: null,
  mounting: '',
  notFound: false,
  ambiguous: [],
  browse: false,
};

const ALL = 'すべて';

function category() {
  return getCategory(S.cat);
}

function matched() {
  return S.matchedId ? store.byId.get(S.matchedId) : null;
}

function filtered() {
  return devicesOf(S.cat).filter((d) => S.maker === ALL || d.maker === S.maker);
}

/* ---------- 検索 ---------- */

/**
 * 検索欄が見る母集団。
 *
 * メーカーチップは一覧パネルの絞り込みであって検索欄の絞り込みではない。
 * 以前は lookup() がカテゴリ全体を、suggestions() が絞り込み後を見ており、
 * サジェストに出ない型式が Enter では出るという食い違いがあった。画面外の
 * 絞り込みで候補が消えると取り違えの温床になるので、どちらもカテゴリ全体を見る。
 */
function searchPool() {
  return devicesOf(S.cat);
}

/**
 * 型式名で引く。集めるのは normLoose、見分けるのは normExact。
 *
 * normLoose はハイフンも小数点も落とすため、三菱 S-N10 とパナソニック SN10、
 * FR-E820-1.5K-1（1.5kW）と FR-E820-15K-1（15kW）が同じ綴りになる。移行元は
 * 先頭一致の1件を無条件に採用していたため、前者では後者の型式に到達できず、
 * インバータでは10倍容量の違う機種を黙って掴んでいた。
 * ここでは複数一致したら確定させず、必ず選ばせる。
 */
function lookup(query) {
  const q = normLoose(query);
  if (!q) return [];
  const pool = searchPool();
  const exact = pool.filter((d) => normLoose(d.model) === q);
  if (exact.length) return exact;
  return pool.filter((d) => normLoose(d.model).includes(q));
}

function doSearch() {
  const hits = lookup(S.q);
  S.ambiguous = [];
  S.notFound = false;
  if (hits.length === 1) {
    select(hits[0].id);
    return;
  }
  if (hits.length > 1) {
    // loose では同じ綴りになる型式が複数ある。取り違えを防ぐため選ばせる。
    // normExact が入力と一致する候補は先頭に出すが、それでも確定はさせない。
    // 小数点を省いた入力（FRE82015K1）は 1.5K ではなく 15K と exact 一致するため、
    // 一致を根拠に確定させると「黙って10倍の機種を掴む」経路が復活する。
    S.ambiguous = [...hits]
      .sort((a, b) => Number(isExactInput(b)) - Number(isExactInput(a)))
      .slice(0, 20);
    render();
    return;
  }
  S.notFound = true;
  S.browse = true;
  render();
}

/** 入力の綴りと（小数点まで含めて）完全に一致するか */
function isExactInput(d) {
  return normExact(d.model) === normExact(S.q);
}

function select(id) {
  S.matchedId = id;
  S.mounting = '';
  S.ambiguous = [];
  S.step = 2;
  render();
}

function suggestions() {
  const q = normLoose(S.q);
  if (q.length < 2) return [];
  const pool = searchPool();
  const pre = pool.filter((d) => normLoose(d.model).indexOf(q) === 0);
  const mid = pool.filter((d) => normLoose(d.model).indexOf(q) > 0);
  return [...pre, ...mid].slice(0, 12);
}

/* ---------- 画面 ---------- */

function header() {
  const total = store.devices.length;
  return `<header>
    <h1>FA部品 互換サーチ</h1>
    <div class="sub">${allCategories().length}カテゴリ / ${total}型式 ・ 完全オフライン</div>
  </header>`;
}

function steps() {
  const labels = ['型式を検索', '仕様を確認', '互換品を表示'];
  return `<div class="steps">${labels.map((l, i) => {
    const n = i + 1;
    const cls = n === S.step ? 'on' : n < S.step ? 'done' : '';
    return `<div class="st ${cls}"><span class="sn">${n}</span><span class="sl">${esc(l)}</span></div>`;
  }).join('')}</div>`;
}

/**
 * カテゴリチップ。大分類は設けず全カテゴリを並べる。
 *
 * 以前は横一列＋横スクロールにしていたが、スマホでは画面外のカテゴリに
 * 気づけない（スクロールバーも出ない）。折り返して全件を一度に見せる。
 */
function categoryChips() {
  return `<div class="chiprow cats" role="tablist">${allCategories().map((c) => {
    const n = devicesOf(c.id).length;
    const on = c.id === S.cat ? ' on' : '';
    const dis = n === 0 ? ' empty' : '';
    return `<button class="chip${on}${dis}" role="tab" aria-selected="${c.id === S.cat}" data-act="cat" data-v="${esc(c.id)}">${esc(c.label)}<span class="cnt">${n}</span></button>`;
  }).join('')}</div>`;
}

function makerChips() {
  const makers = [ALL, ...makersOf(S.cat)];
  return `<div class="chiprow">${makers.map((m) =>
    `<button class="chip sm${m === S.maker ? ' on' : ''}" data-act="maker" data-v="${esc(m)}">${esc(m)}</button>`).join('')}</div>`;
}

/**
 * 一覧の1行。
 *
 * opts.spec を渡すと、主スペックではなくそのスペックをラベル付きで副表示にする。
 * 曖昧一致リストが「候補どうしで値が割れているスペック」を出すために使う。
 * 主スペック任せにすると、インバータのように主スペック（定格出力電流）が
 * 全件未登録のカテゴリで副表示が系列名に落ち、1.5kW と 15kW が同じ見た目になる。
 */
function deviceRow(d, act, opts = {}) {
  const sd = opts.spec || primarySpec(category());
  const spec = formatSpec(sd, d);
  let sub;
  if (opts.spec) {
    // 識別用の指定時は「―」であること自体が識別材料なので、系列名にすり替えない
    sub = `${esc(opts.spec.label)} ${esc(spec)}`;
  } else {
    // 主スペックを持たない行（シリーズ単位のマスクなど）は「―」だけになるので系列名を出す
    sub = esc(spec === '―' && d.series ? d.series : spec);
  }
  const exact = opts.exact ? '<span class="badge b-exact">入力と完全一致</span>' : '';
  return `<button class="row" data-act="${act}" data-v="${esc(d.id)}">
    <span class="row-main"><span class="mono">${esc(d.model)}</span> ${exact}${statusBadges(d)}</span>
    <span class="row-sub">${esc(d.maker)} ・ ${sub}</span>
  </button>`;
}

/**
 * 曖昧一致リスト。
 *
 * 「取り違えを防ぐため選んでください」と言う以上、見分ける材料を必ず添える。
 * 候補どうしで値が割れているスペックを1つ選んで全行に併記し、その差が大きい
 * ときは何倍違うのかまで警告文に書く（1.5kW と 15kW の取り違えは誤発注になる）。
 */
function ambiguousPanel() {
  if (!S.ambiguous.length) return '';
  const sd = distinguishingSpec(category(), S.ambiguous);
  // 全候補が完全一致（S-N10 / SN10 のようにハイフン差だけの組）ならバッジは選別の
  // 役に立たないので出さない。一部だけが一致するときに絞り込みの手がかりになる
  const exactCount = S.ambiguous.filter(isExactInput).length;
  const marksExact = exactCount > 0 && exactCount < S.ambiguous.length;
  const rows = S.ambiguous
    .map((d) => deviceRow(d, 'pick', { spec: sd, exact: marksExact && isExactInput(d) }))
    .join('');
  return `<div class="warn"><div>⚠ 入力と同じ綴りに読める型式が ${S.ambiguous.length} 件あります。
      ${spreadNote(sd, S.ambiguous)}取り違えを防ぐため、目的の型式を選んでください。</div></div>
    <div class="rows">${rows}</div>`;
}

/** 識別スペックの開きが大きいときに、何倍違うのかを名指しする */
function spreadNote(sd, devices) {
  if (!sd) return '';
  const vals = devices.map((d) => d.specs?.[sd.key]).filter((v) => typeof v === 'number' && v > 0);
  if (vals.length < 2) return '';
  const lo = Math.min(...vals);
  const hi = Math.max(...vals);
  const ratio = hi / lo;
  if (ratio < 2) return '';
  return `<b class="amber">${esc(sd.label)}が ${esc(formatSpecValue(sd, lo))} と ${esc(formatSpecValue(sd, hi))} で
    約${num(Math.round(ratio * 10) / 10)}倍違います。</b>`;
}

function viewSearch() {
  const cat = category();
  const list = filtered();
  const sug = suggestions();
  const empty = devicesOf(S.cat).length === 0;

  let body = `${categoryChips()}
    <div class="panel">
      <label class="lbl" for="q">型式を入力</label>
      <div class="searchbar">
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               value="${esc(S.q)}" placeholder="例: S-T10 / TH-T18 / E2E-X4D1" />
        <button class="btn primary" data-act="search">検索</button>
      </div>
      <div id="sug">${sug.length ? sug.map((d) => deviceRow(d, 'pick')).join('') : ''}</div>
      ${S.notFound ? '<div class="warn"><div>該当する型式が見つかりませんでした。下の一覧から選んでください。</div></div>' : ''}
      ${ambiguousPanel()}
    </div>`;

  if (empty) {
    body += `<div class="panel empty-note">
      <b class="amber">${esc(cat.label)}は実在確認済みのデータが未登録です。</b>
      <div>組み合わせ生成による型式は、実在しない品番を候補に出し誤発注を招くため表示していません。
      メーカー型式表で確認できたものから順次登録します。</div>
    </div>`;
  } else {
    body += `<div class="panel">
      <button class="btn ghost wide" data-act="browse">${S.browse ? '一覧を閉じる' : `一覧から選ぶ（${list.length}件）`}</button>
      ${S.browse ? `${makerChips()}<div class="rows scroll">${list.map((d) => deviceRow(d, 'pick')).join('')}</div>` : ''}
    </div>`;
  }
  return body;
}

function viewConfirm() {
  const m = matched();
  const cat = category();
  if (!m) return viewSearch();

  const options = mountingOptions(devicesOf(S.cat));
  const chain = successorChain(m, store.byId);
  const disc = discontinuedNote(m, store.byId);

  return `<div class="panel">
      <div class="card-head">
        <div>
          <div class="maker">${esc(m.maker)} ${statusBadges(m)}</div>
          <div class="model mono big">${esc(m.model)}</div>
        </div>
      </div>
      ${scopeNote(m)}
      ${disc}
      ${noteBox(m)}
      ${warningBox(m)}
      ${chain.length ? `<div class="cmp cmp-info"><b>後継品</b><span>${[m, ...chain].map((d) => esc(d.model)).join(' → ')}</span></div>` : ''}
      ${specGrid(cat, m)}
      <div class="evidence">${evidenceRow(m)}</div>
      ${m.evidence?.dims?.state === 'verified' && m.dims ? dimDiagram(m.dims, m.holes) : '<div class="dim-none">外形寸法は未確認のため図を表示しません。</div>'}
    </div>
    <div class="panel">
      ${options.length ? `<label class="lbl">取付方式（既設に合わせて選択）</label>
      <div class="chiprow">${options.map((o) =>
        `<button class="chip sm${(S.mounting || m.mounting) === o ? ' on' : ''}" data-act="mount" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : ''}
      <button class="btn primary wide" data-act="step" data-v="3">この仕様で互換品を表示</button>
      <button class="btn ghost wide" data-act="step" data-v="1">型式を選び直す</button>
    </div>`;
}

function viewResult() {
  const m = matched();
  const cat = category();
  if (!m) return viewSearch();
  const ps = primarySpec(cat);
  const list = computeCompatibles(m, cat, { mounting: S.mounting });

  // 型式を画面で最大に見せる場所なので、生産終了バッジは他の呼び出し箇所と同様にここでも出す。
  // バッジが無いと「発注してはいけない型式」が一番目立つ見た目になる。
  const head = `<div class="panel">
    <div class="result-head">
      <span class="mono big">${esc(m.model)}</span>${statusBadges(m)}
      <span class="sub">${esc(m.maker)} ・ ${esc(formatSpec(ps, m))}</span>
    </div>
    <div class="sub">互換品候補 ${list.length}件</div>
  </div>`;

  // 0件の理由はカテゴリごとに違う。説明を持っているカテゴリにはそれを言わせる
  const empty = cat.emptyNote(m) ||
    `<b class="amber">互換候補が登録されていません。</b>
     <div>電気的に成立しない組み合わせ（出力極性・配線本数の相違）は候補から除外しています。</div>`;
  const body = list.length
    ? list.map((c, i) => candidateCard(cat, m, c, i)).join('')
    : `<div class="panel empty-note">${empty}</div>`;

  return `${head}${body}
    <div class="panel">
      <button class="btn ghost wide" data-act="step" data-v="2">仕様の確認に戻る</button>
      <button class="btn ghost wide" data-act="reset">最初からやり直す</button>
    </div>
    <div class="foot">表示内容はカタログ値に基づく参考情報です。発注前にメーカー仕様書で確定してください。</div>`;
}

/* ---------- 描画 ---------- */

function render() {
  const app = document.getElementById('app');
  const view = S.step === 1 ? viewSearch() : S.step === 2 ? viewConfirm() : viewResult();
  app.innerHTML = header() + steps() + view;

  const q = document.getElementById('q');
  if (q) {
    q.addEventListener('input', () => {
      S.q = q.value;
      S.notFound = false;
      S.ambiguous = [];
      // iOS Safari 対策: 入力中は全体を再描画せず候補欄だけ差し替える
      const sug = document.getElementById('sug');
      if (sug) sug.innerHTML = suggestions().map((d) => deviceRow(d, 'pick')).join('');
    });
    q.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); q.blur(); doSearch(); }
    });
  }
  window.scrollTo(0, 0);
}

const ACTIONS = {
  cat(v) {
    S.cat = v;
    S.q = ''; S.maker = ALL; S.matchedId = null; S.step = 1;
    S.notFound = false; S.ambiguous = []; S.browse = false;
  },
  maker(v) { S.maker = v; },
  pick(v) { select(v); return true; },
  mount(v) { S.mounting = v; },
  search() { doSearch(); return true; },
  browse() { S.browse = !S.browse; },
  step(v) { S.step = Number(v); },
  reset() { S.q = ''; S.matchedId = null; S.mounting = ''; S.step = 1; S.notFound = false; S.ambiguous = []; S.browse = false; },
};

function start() {
  S.cat = allCategories().find((c) => devicesOf(c.id).length > 0)?.id || allCategories()[0].id;
  document.getElementById('app').addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const fn = ACTIONS[t.dataset.act];
    if (!fn) return;
    if (fn(t.dataset.v) === true) return; // 自前で render 済み
    render();
  });
  render();
}


/* ===== categories/contactor.mjs ===== */
/** 電磁接触器 / 電磁開閉器。容量帯（定格使用電流）で候補を絞る。 */

/** メーカーごとに容量の刻みが違う（日立HC10=13A / 三菱S-N10=11A）ため窓で見る */
const CURRENT_WINDOW = 0.3;

const currentSpec = {
  key: 'ratedCurrentA', label: '定格使用電流', unit: 'A', primary: true,
  format: (v) => `${num(v)}A`,
  distance: (a, b) => Math.abs(a - b),
};

const powerSpec = { key: 'ratedPowerKW', label: '適用モータ容量', unit: 'kW', format: (v) => `${num(v)}kW` };

function baseGate(a, m) {
  if (a.id === m.successorId) return true; // メーカー公表の後継品は無条件で候補
  return withinWindow(a.specs?.ratedCurrentA, m.specs?.ratedCurrentA, CURRENT_WINDOW);
}

function auxLabel(aux) {
  return aux ? `${aux.a}a${aux.b}b` : '―';
}

function baseEnrich(a, m) {
  return {
    auxMatch: !!a.specs?.aux && !!m.specs?.aux && a.specs.aux.a === m.specs.aux.a && a.specs.aux.b === m.specs.aux.b,
    currentDiff: Math.abs((a.specs?.ratedCurrentA ?? 0) - (m.specs?.ratedCurrentA ?? 0)),
  };
}

function baseRank(a, b) {
  return (
    preferTrue(a.isSuccessor, b.isSuccessor) ||
    ascending(a.currentDiff, b.currentDiff) ||
    preferTrue(a.mountingMatch, b.mountingMatch) ||
    preferTrue(a.auxMatch, b.auxMatch) ||
    evidenceRank(a) - evidenceRank(b) ||
    preferTrue(a.holeMatch === true, b.holeMatch === true) ||
    ascending(a.diff, b.diff)
  );
}

function baseSummary(d) {
  return [
    { label: '定格使用電流', value: d.specs?.ratedCurrentA != null ? `${num(d.specs.ratedCurrentA)}A` : '―' },
    { label: '適用モータ容量', value: d.specs?.ratedPowerKW != null ? `${num(d.specs.ratedPowerKW)}kW` : '―' },
    { label: '操作コイル', value: d.specs?.coil || '―' },
    { label: '補助接点', value: auxLabel(d.specs?.aux) },
  ];
}

registerCategory({
  id: 'contactor',
  label: '電磁接触器',
  group: 'magnet',
  specDefs: [currentSpec, powerSpec],
  gate: baseGate,
  enrich: baseEnrich,
  rank: baseRank,
  summary: baseSummary,
});

registerCategory({
  id: 'starter',
  label: '電磁開閉器',
  group: 'magnet',
  specDefs: [currentSpec, powerSpec],
  /**
   * 欠相保護付き（-KP）は欠相保護付きとしか置き換えられない。
   * 保護機能を落とす置換を候補に出さない。
   */
  gate(a, m) {
    const akp = /-KP$/.test(a.compatKey || '');
    const mkp = /-KP$/.test(m.compatKey || '');
    if (akp !== mkp) return false;
    return baseGate(a, m);
  },
  enrich: baseEnrich,
  rank: baseRank,
  summary: baseSummary,
});


/* ===== categories/drive.mjs ===== */
/**
 * インバータ / サーボユニット。
 *
 * 移行元の1467件のうち1440件は buildInv/buildServo による組み合わせ生成物で
 * 実在確認が取れていない。data/_seed/ に provisional として凍結してあり、
 * 誤発注防止のため配布物にも入れない。インバータの実データはこの結果0件から
 * 始まり、出典URL付きで昇格したものから順に表示される（現在は三菱 FREQROL のみで、
 * 現行品 FR-E800 と生産終了品 FR-E700 の両方を含む。件数は tools/smoke.mjs と
 * tools/test-compat.mjs が持つ。docs/mitsubishi-fr-e800-verified.md と
 * docs/fr-e700-to-e800-replacement.md 参照）。
 *
 * 昇格したレコードは公式で確認できた項目しか持たない。FR-E800 の40機種は
 * 専用カタログ L(名)06130-J p.81-83 から定格出力電流と定格容量(kVA)を取得済みで、
 * gate が引く主スペック specs.ratedCurrentA が揃ったため互換候補が算出できる。
 * 外形寸法は未取得なので dims 由来のバッジは「要検証」のまま出る。
 *
 * 定格は **ND定格**（Pr.570 多重定格選択の初期設定）で統一する。形名の容量表記と
 * 4桁電流コード（FR-E820-3.7K-1 ≡ FR-E820-0175 ＝ 17.5A）がND基準なので、
 * 形名から引ける値と specs が一致する。LD定格は登録しない。ratedCurrentA という
 * 名前はどちらの定格かを語らず、多重定格を持たない接触器カテゴリとも共有している
 * ため、同じキー空間にLD値を並べると取り違えの入口になる。
 *
 * 残る27件は安川サーボの生産中止一覧（メーカー公表の実データ）で、
 * data/servo.json に入っている。1行が `SGDM / SGDH / SGDP` や
 * `CACR-SR□□BB/BC` というワイルドカード付きのシリーズ単位マスクなので
 * `modelScope:"series"` が付いており、コアが互換判定から除外する。
 * 「その型式がいつ生産中止になり、いつまで修理できるか」を引くための行。
 */

/** 電源相数。単相入力機と3相入力機は電圧クラスが同じでも置換できない。 */
function supplyPhase(d) {
  return /単相/.test(d.specs?.voltage || '') ? 1 : 3;
}

registerCategory({
  id: 'inverter',
  label: 'インバータ',
  group: 'drive',
  /**
   * 宣言順は「見分けやすさ」の順。主スペック（判定に使う値）とは別で、
   * `primary` フラグのほうが主スペックを決める。
   *
   * 適用モータ容量を先頭に置くのは、曖昧一致リストの識別材料が
   * `distinguishingSpec` によって宣言順の先頭から選ばれるため。現場の保全員は
   * 設備の銘板やモータ側から型式に入ることが多く、`FR-E820-1.5K-1` と
   * `FR-E820-15K-1` の取り違えは「1.5kW / 15kW」なら即断できるが、
   * 「8A / 60A」だとモータ容量からの変換が一段挟まる。判定は定格出力電流で
   * 行いつつ、人が見分ける材料は容量を出す。並べ替えないこと。
   */
  specDefs: [
    { key: 'ratedPowerKW', label: '適用モータ容量', unit: 'kW', format: (v) => `${num(v)}kW` },
    { key: 'ratedCurrentA', label: '定格出力電流', unit: 'A', primary: true, format: (v) => `${num(v)}A`, distance: (a, b) => Math.abs(a - b) },
    { key: 'ratedCapacityKVA', label: '定格容量', unit: 'kVA', format: (v) => `${num(v)}kVA` },
  ],
  gate(a, m) {
    if (a.id === m.successorId) return true;
    if (a.specs?.voltClass !== m.specs?.voltClass) return false;
    // 電圧クラスだけでは電源相数が区別できない。FR-E820S(単相200V入力) は
    // モータへの出力が3相200Vなので FR-E820(3相200V入力) と同じ 200 クラスだが、
    // 電源が違うので置換できない。voltClass の数値比較に任せると通ってしまう。
    if (supplyPhase(a) !== supplyPhase(m)) return false;
    return withinWindow(a.specs?.ratedCurrentA, m.specs?.ratedCurrentA, 0.3);
  },
  enrich(a, m) {
    return { currentDiff: Math.abs((a.specs?.ratedCurrentA ?? 0) - (m.specs?.ratedCurrentA ?? 0)) };
  },
  rank(a, b) {
    return (
      preferTrue(a.isSuccessor, b.isSuccessor) ||
      ascending(a.currentDiff, b.currentDiff) ||
      preferTrue(a.sameMaker, b.sameMaker) ||
      evidenceRank(a) - evidenceRank(b) ||
      ascending(a.diff, b.diff)
    );
  },
  summary(d) {
    return [
      { label: '定格出力電流', value: d.specs?.ratedCurrentA != null ? `${num(d.specs.ratedCurrentA)}A` : '―' },
      { label: '適用モータ容量', value: d.specs?.ratedPowerKW != null ? `${num(d.specs.ratedPowerKW)}kW` : '―' },
      { label: '定格容量', value: d.specs?.ratedCapacityKVA != null ? `${num(d.specs.ratedCapacityKVA)}kVA` : '―' },
      { label: '電源電圧', value: d.specs?.voltage || '―' },
    ];
  },
});

registerCategory({
  id: 'servo',
  label: 'サーボユニット',
  group: 'drive',
  specDefs: [
    {
      key: 'ratedPowerW', label: '定格出力', unit: 'W', primary: true,
      format: (v) => (v >= 1000 ? `${num(v / 1000)}kW` : `${num(v)}W`),
      distance: logRatio,
    },
  ],
  gate(a, m) {
    if (a.id === m.successorId) return true;
    if (a.specs?.voltClass !== m.specs?.voltClass) return false;
    return withinWindow(a.specs?.ratedPowerW, m.specs?.ratedPowerW, 0.3);
  },
  enrich(a, m) {
    return {
      ifaceMatch: a.specs?.ikey === m.specs?.ikey,
      powerGap: logRatio(a.specs?.ratedPowerW, m.specs?.ratedPowerW) ?? Infinity,
    };
  },
  rank(a, b) {
    return (
      preferTrue(a.isSuccessor, b.isSuccessor) ||
      preferTrue(a.ifaceMatch, b.ifaceMatch) ||
      ascending(a.powerGap, b.powerGap) ||
      preferTrue(a.sameMaker, b.sameMaker) ||
      evidenceRank(a) - evidenceRank(b) ||
      ascending(a.diff, b.diff)
    );
  },
  summary(d) {
    // 生産中止シリーズは寸法も定格も持たない。持っている行だけを出す
    if (d.modelScope === 'series') {
      return [
        { label: 'シリーズ', value: d.series || '―' },
        { label: '生産中止', value: d.specs?.discontinuedAt || '―' },
        { label: '補修部品 受付終了', value: d.specs?.partsOrderUntil || '―' },
        { label: '修理対応 期限', value: d.specs?.repairUntil || '受付終了' },
        { label: 'メーカー案内の代替', value: d.specs?.altSeries || 'なし' },
      ];
    }
    return [
      { label: '定格出力', value: d.specs?.ratedPowerW != null ? (d.specs.ratedPowerW >= 1000 ? `${num(d.specs.ratedPowerW / 1000)}kW` : `${num(d.specs.ratedPowerW)}W`) : '―' },
      { label: '指令インタフェース', value: d.specs?.iface || '―' },
      { label: '電源電圧', value: d.specs?.voltage || '―' },
      { label: 'エンコーダ', value: d.specs?.encoder || '―' },
    ];
  },
  emptyNote(m) {
    if (m.modelScope !== 'series') return '';
    const alt = m.specs?.altSeries;
    const lead = alt
      ? `メーカーが案内する代替は <b class="amber">${esc(alt)}</b> です。`
      : 'メーカーが案内する代替シリーズはありません。';
    return `<b class="amber">この行はシリーズ単位のため、型式ごとの互換判定は行いません。</b>
      <div>${lead}
      置換にはアンプ・モータ・エンコーダ・指令インタフェースの組み合わせが関わるため、
      現物の銘板から個別型式を確定させたうえでメーカー選定資料で確認してください。</div>`;
  },
  detailPanels(m, c) {
    if (c.ifaceMatch) return [];
    return [{
      tone: 'warn',
      title: '指令インタフェース',
      body: `${m.specs?.iface || '不明'} → ${c.specs?.iface || '不明'} と異なります。アンプ単体では置換できません。`,
    }];
  },
});


/* ===== categories/sensor-common.mjs ===== */
/** センサー4カテゴリで共有する判定要素。 */

/** 限定反射形と距離設定形は相互に置換しうる */
const METHOD_EQUIV = { '限定反射形': ['距離設定形'], '距離設定形': ['限定反射形'] };

function methodOK(a, b) {
  if (!a || !b) return true;
  return a === b || (METHOD_EQUIV[b] || []).includes(a);
}

/** 2線式 / 3線式。配線本数が違うものは物理的に置換できない。 */
function wireCount(d) {
  const s = `${d.specs?.outputSpec || ''} ${d.specs?.voltage || ''}`;
  if (s.includes('3線')) return 3;
  if (s.includes('2線')) return 2;
  return null;
}

/**
 * 出力極性の集合を返す。
 *
 * `NPN/PNP(3線式)` のような選択可能品があるため、単一値ではなく集合として扱う。
 * 極性を持たない表記（`N.O.`、`2線式`、`リレー接点` など）は null を返し、判定に使わない。
 */
function polarities(d) {
  const s = d.specs?.outputSpec || '';
  const set = [];
  if (/NPN/.test(s)) set.push('NPN');
  if (/PNP/.test(s)) set.push('PNP');
  return set.length ? set : null;
}

/**
 * 出力極性の適合。
 *
 * 移行元では NPN/PNP の不一致が第7位のタイブレークでしかなく、検出距離が近ければ
 * PNP品がNPN品より上位に出た。シンク入力PLCに対して動作しない置換が候補No.1に
 * なりうるため、ここでは候補段階で除外する。
 * 集合が交わればよい（NPN/PNP選択可能品は NPN機の代替になる）。
 */
function polarityOK(a, m) {
  const pa = polarities(a);
  const pm = polarities(m);
  if (!pa || !pm) return true; // どちらかが極性を持たない表記なら判定しない
  return pa.some((p) => pm.includes(p));
}

/** 接点形式（NO/NC）。論理が反転するのでバッジと順位で明示する。 */
function contactForms(d) {
  const s = d.specs?.outputSpec || '';
  const set = [];
  if (/N\.?O\.?/i.test(s) || /\bNO\b/.test(s)) set.push('NO');
  if (/N\.?C\.?/i.test(s) || /\bNC\b/.test(s)) set.push('NC');
  return set.length ? set : null;
}

function contactFormOK(a, m) {
  const ca = contactForms(a);
  const cm = contactForms(m);
  if (!ca || !cm) return true;
  return ca.some((x) => cm.includes(x));
}

const distanceSpec = {
  key: 'sensingDistanceMM', label: '検出距離', unit: 'mm', primary: true,
  format: (v) => (v >= 1000 ? `${num(v / 1000)}m` : `${num(v)}mm`),
  // 検出距離は 2mm〜100m と4桁半に広がるため、線形差ではなく対数比で見る
  distance: logRatio,
};

/** 検出距離の近さ。片方でも値が無ければ最下位（旧 dr:99 相当）。 */
function distanceGap(a, m) {
  const r = logRatio(a.specs?.sensingDistanceMM, m.specs?.sensingDistanceMM);
  return r == null ? Infinity : r;
}

function sensorGate(a, m) {
  if (!polarityOK(a, m)) return false; // 電気的に成立しない置換は出さない
  const wm = wireCount(m);
  const wa = wireCount(a);
  if (wm && wa && wm !== wa) return false;
  if (a.id === m.successorId) return true;
  if (a.compatKey && a.compatKey === m.compatKey) return true;
  if (a.specs?.compatGroup && a.specs.compatGroup === m.specs?.compatGroup) {
    if (m.category === 'proximity') return a.specs?.threadSize === m.specs?.threadSize;
    return methodOK(a.specs?.detectMethod, m.specs?.detectMethod);
  }
  return false;
}

function sensorEnrich(a, m) {
  return {
    methodMatch: methodOK(a.specs?.detectMethod, m.specs?.detectMethod),
    threadMatch: !m.specs?.threadSize || a.specs?.threadSize === m.specs?.threadSize,
    contactMatch: contactFormOK(a, m),
    outputMatch: a.specs?.outputSpec === m.specs?.outputSpec,
    tempDown: !!(m.specs?.tempMaxC && a.specs?.tempMaxC && a.specs.tempMaxC < m.specs.tempMaxC),
    distGap: distanceGap(a, m),
  };
}

function sensorRank(a, b) {
  return (
    preferTrue(a.isSuccessor, b.isSuccessor) ||
    preferTrue(a.methodMatch, b.methodMatch) ||
    preferTrue(a.threadMatch, b.threadMatch) ||
    preferTrue(a.contactMatch, b.contactMatch) ||
    // 対数比 0.01 ≒ 距離差 2.3% 以内は同等とみなす
    (Math.abs(a.distGap - b.distGap) > 0.01 ? a.distGap - b.distGap : 0) ||
    preferTrue(!a.tempDown, !b.tempDown) ||
    preferTrue(a.mountingMatch, b.mountingMatch) ||
    preferTrue(a.outputMatch, b.outputMatch) ||
    evidenceRank(a) - evidenceRank(b) ||
    ascending(a.diff, b.diff)
  );
}

function sensorSummary(d) {
  return [
    { label: '検出方式', value: d.specs?.detectMethod || '―' },
    { label: 'サイズ/ねじ径', value: d.specs?.threadSize || '―' },
    { label: '電源電圧', value: d.specs?.voltage || '―' },
    { label: '出力方式', value: d.specs?.outputSpec || '―' },
    { label: '使用温度(最高)', value: d.specs?.tempMaxC ? `〜${d.specs.tempMaxC}℃` : '―' },
  ];
}

/** 電線の被覆色の比較。既設との差異を明示する。 */
function wiringPanel(m, c) {
  const a = m.specs?.cableColors;
  const b = c.specs?.cableColors;
  if (!a || !b) return null;
  const rows = [['+ (茶)', 'plus'], ['- (青)', 'minus'], ['出力 (黒)', 'out']];
  const diff = rows.filter(([, k]) => a[k] !== b[k]).length;
  return {
    tone: diff ? 'warn' : 'ok',
    title: '電線の被覆色',
    body: diff
      ? `既設と ${diff} 箇所で異なります（${rows.filter(([, k]) => a[k] !== b[k]).map(([, k]) => `${a[k]}→${b[k]}`).join(' / ')}）。結線時に注意してください。`
      : '既設品と同一です。',
  };
}


/* ===== categories/sensors.mjs ===== */
/** 近接 / 光電 / 超音波 / 特殊。判定の実体は sensor-common.mjs にある。 */

const common = {
  group: 'sensor',
  gate: sensorGate,
  enrich: sensorEnrich,
  rank: sensorRank,
  summary: sensorSummary,
  detailPanels: (m, c) => [wiringPanel(m, c)].filter(Boolean),
};

registerCategory({ ...common, id: 'proximity', label: '近接スイッチ', specDefs: [distanceSpec] });
registerCategory({ ...common, id: 'photo', label: 'フォトスイッチ', specDefs: [distanceSpec] });
registerCategory({ ...common, id: 'ultrasonic', label: '超音波センサ', specDefs: [distanceSpec] });

/**
 * 特殊（熱間金属 / 光学式 / 導光路）。
 *
 * このカテゴリは移行前、同じ ratedA に「導光路長(mm)」と「該当なしを表す 0」が
 * 同居していた。移行後は導光路品だけが lightGuideLengthMM を持ち、熱間金属・光学式は
 * 距離系のキーを持たない。specDefs に無いキーは表示も判定も自動的にスキップされるため、
 * 「0mm 同士だから完全一致」といった誤判定が起こらない。
 */
registerCategory({
  ...common,
  id: 'special',
  label: '特殊(熱間/光学/導光)',
  specDefs: [
    {
      key: 'lightGuideLengthMM', label: '導光路長', unit: 'mm', primary: true,
      format: (v) => (v >= 1000 ? `${num(v / 1000)}m` : `${num(v)}mm`),
      distance: (a, b) => Math.abs(Math.log10(a / b)),
    },
  ],
  summary(d) {
    const rows = sensorSummary(d);
    if (d.specs?.lightGuideLengthMM != null) {
      rows.unshift({ label: '導光路長', value: `${num(d.specs.lightGuideLengthMM / 1000)}m` });
    }
    return rows;
  },
});


/* ===== categories/thermal.mjs ===== */
/** サーマルリレー。整定電流の調整範囲の重なりで候補を絞る。 */

const OVERLAP_THRESHOLD = 0.3;

/** 保護方式の変化。2E→1E は欠相保護を失うので最下位に落とす。 */
function protectDiff(a, m) {
  const pa = a.specs?.protect;
  const pm = m.specs?.protect;
  if (!pa || !pm) return { level: 'diff', text: '保護方式不明' };
  if (pa === pm) return { level: 'same', text: `${pa} 同一` };
  if (pm === '1E' && pa === '2E') return { level: 'up', text: '1E→2E 欠相保護が追加' };
  if (pm === '2E' && pa === '1E') return { level: 'down', text: '2E→1E 欠相保護を失う' };
  return { level: 'diff', text: `${pm}→${pa}` };
}

/** 取付先の接触器が共通かどうか。共通でなければ接触器ごと交換になる。 */
function fitLevel(a, m) {
  const am = a.specs?.mountsOn || [];
  const mm = m.specs?.mountsOn || [];
  const shared = am.filter((x) => mm.includes(x));
  if (shared.length) return { level: 'ok', text: `共通取付: ${shared.slice(0, 3).join(' / ')}`, shared };
  if (a.maker === m.maker) return { level: 'warn', text: '同一メーカーだが取付可能な接触器が異なる', shared: [] };
  return { level: 'ng', text: '取付穴が異なるため接触器も交換が必要', shared: [] };
}

const PROTECT_ORDER = { same: 0, up: 1, diff: 2, down: 3 };
const FIT_ORDER = { ok: 0, warn: 1, ng: 2 };

registerCategory({
  id: 'thermal',
  label: 'サーマルリレー',
  group: 'magnet',
  specDefs: [
    {
      key: 'setRangeA', label: '整定電流調整範囲', unit: 'A', primary: true,
      format: (v) => `${num(v.min)}〜${num(v.max)}A`,
      distance: (a, b) => 1 - rangeOverlap(a, b),
    },
  ],
  gate(a, m) {
    if (a.id === m.successorId) return true;
    // 保護方式が違っても候補には出す（バッジで明示し、順位で落とす）
    return rangeOverlap(a.specs?.setRangeA, m.specs?.setRangeA) >= OVERLAP_THRESHOLD;
  },
  enrich(a, m) {
    return {
      overlap: rangeOverlap(a.specs?.setRangeA, m.specs?.setRangeA),
      protectDiff: protectDiff(a, m),
      fitLevel: fitLevel(a, m),
    };
  },
  rank(a, b) {
    return (
      preferTrue(a.isSuccessor, b.isSuccessor) ||
      PROTECT_ORDER[a.protectDiff.level] - PROTECT_ORDER[b.protectDiff.level] ||
      FIT_ORDER[a.fitLevel.level] - FIT_ORDER[b.fitLevel.level] ||
      b.overlap - a.overlap ||
      preferTrue(a.mountingMatch, b.mountingMatch) ||
      evidenceRank(a) - evidenceRank(b) ||
      ascending(a.diff, b.diff)
    );
  },
  summary(d) {
    const r = d.specs?.setRangeA;
    return [
      { label: '整定電流調整範囲', value: r ? `${num(r.min)}〜${num(r.max)}A` : '―' },
      { label: '保護方式', value: d.specs?.protect === '2E' ? '2E（過負荷＋欠相）' : d.specs?.protect === '1E' ? '1E（過負荷）' : '―' },
      { label: '取付可能な接触器', value: (d.specs?.mountsOn || []).join(' / ') || '―' },
      { label: '単独取付アダプタ', value: d.specs?.standalone || '―' },
    ];
  },
  detailPanels(m, c) {
    const panels = [];
    if (c.protectDiff) {
      panels.push({
        tone: c.protectDiff.level === 'down' ? 'warn' : c.protectDiff.level === 'same' ? 'ok' : 'info',
        title: '保護方式',
        body: c.protectDiff.text + (c.protectDiff.level === 'down' ? '。欠相保護が必要な用途では使用できません。' : ''),
      });
    }
    if (c.fitLevel) {
      panels.push({
        tone: c.fitLevel.level === 'ok' ? 'ok' : c.fitLevel.level === 'warn' ? 'info' : 'warn',
        title: '取付適合',
        body: c.fitLevel.text,
      });
    }
    return panels;
  },
});
