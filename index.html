/* ================= ロジック ================= */
function dimDiff(a,b){if(!a||!b)return null;return Math.abs(a.w-b.w)+Math.abs(a.h-b.h)+Math.abs(a.d-b.d);}
function capacityDisplay(d){
  var u=(CATEGORY_META[d.category]||{}).unit||"A";
  if(d.category==="thermal"&&d.ratedRangeA)return d.ratedRangeA+u;
  return d.ratedA+u;
}
function auxLabel(x){return x?(x.a+"a"+x.b+"b"):"-";}
function findDevice(id){for(var i=0;i<ALL_DEVICES.length;i++){if(ALL_DEVICES[i].id===id)return ALL_DEVICES[i];}return null;}
function successorChain(d){
  var chain=[],cur=d,seen={};seen[cur.id]=1;
  while(cur.successorId){var n=findDevice(cur.successorId);if(!n||seen[n.id])break;chain.push(n);seen[n.id]=1;cur=n;}
  return chain;
}
function computeCompatibles(m,mountInput){
  if(!m)return [];
  var actualMounting=mountInput||m.mounting;
  var arr=ALL_DEVICES.filter(function(a){
    return a.category===m.category&&a.id!==m.id&&(a.capacityClass===m.capacityClass||a.id===m.successorId);
  }).map(function(a){
    var unverified=!!(a.unverified||m.unverified)||!a.dims||!m.dims;
    var mountingMatch=a.mounting===actualMounting;
    var auxMatch=!m.aux||(a.aux&&a.aux.a===m.aux.a&&a.aux.b===m.aux.b);
    // 寸法データ未検証の場合は穴の一致判定を行わない(誤った✓表示を防ぐ)
    var holeMatch=unverified?null:(!m.holes||(a.holes&&a.holes.w===m.holes.w&&a.holes.h===m.holes.h));
    var isSuccessor=a.id===m.successorId;
    return Object.assign({},a,{diff:dimDiff(a.dims,m.dims),unverifiedDims:unverified,mountingMatch:mountingMatch,auxMatch:auxMatch,holeMatch:holeMatch,isSuccessor:isSuccessor});
  });
  arr.sort(function(a,b){
    if(a.isSuccessor!==b.isSuccessor)return a.isSuccessor?-1:1;
    var ca=Math.abs(a.ratedA-m.ratedA),cb=Math.abs(b.ratedA-m.ratedA);
    if(ca!==cb)return ca-cb;
    if(a.mountingMatch!==b.mountingMatch)return a.mountingMatch?-1:1;
    if(a.auxMatch!==b.auxMatch)return a.auxMatch?-1:1;
    // 寸法未検証は判定材料が少ないため、検証済み候補の後ろに回す
    if(a.unverifiedDims!==b.unverifiedDims)return a.unverifiedDims?1:-1;
    if(a.holeMatch!==b.holeMatch)return a.holeMatch?-1:1;
    if(a.diff===null&&b.diff===null)return 0;
    if(a.diff===null)return 1;
    if(b.diff===null)return -1;
    return a.diff-b.diff;
  });
  return arr;
}

function dimDiagram(dims,holes){
  var scale=1.4,w=dims.w*scale,h=dims.h*scale;
  var hw=holes?holes.w*scale:0,hh=holes?holes.h*scale:0;
  var hx=40+(w-hw)/2,hy=10+(h-hh)/2;
  var s='<svg width="'+(w+60)+'" height="'+(h+40)+'" style="overflow:visible">';
  s+='<rect x="40" y="10" width="'+w+'" height="'+h+'" fill="#2A3644" stroke="#E8A33D" stroke-width="1.5" rx="3"/>';
  if(holes){
    s+='<rect x="'+hx+'" y="'+hy+'" width="'+hw+'" height="'+hh+'" fill="none" stroke="#4CAF7D" stroke-width="1.2" stroke-dasharray="4 3"/>';
    s+='<circle cx="'+hx+'" cy="'+hy+'" r="2.5" fill="#4CAF7D"/><circle cx="'+(hx+hw)+'" cy="'+hy+'" r="2.5" fill="#4CAF7D"/>';
    s+='<circle cx="'+hx+'" cy="'+(hy+hh)+'" r="2.5" fill="#4CAF7D"/><circle cx="'+(hx+hw)+'" cy="'+(hy+hh)+'" r="2.5" fill="#4CAF7D"/>';
  }
  s+='<text x="'+(40+w/2)+'" y="'+(h+30)+'" text-anchor="middle" font-size="11" fill="#8A99A8" font-family="ui-monospace,monospace">W '+dims.w+'mm</text>';
  s+='<text x="20" y="'+(10+h/2)+'" text-anchor="middle" font-size="11" fill="#8A99A8" font-family="ui-monospace,monospace" transform="rotate(-90 20 '+(10+h/2)+')">H '+dims.h+'mm</text>';
  s+='</svg>';
  var out='<div style="display:flex;align-items:center;gap:24px;padding:12px 0;flex-wrap:wrap">'+s;
  out+='<div class="mono" style="font-size:13px;color:var(--sub)">奥行 D<br><span style="color:var(--ink);font-size:16px">'+dims.d+'mm</span></div>';
  if(holes)out+='<div class="mono" style="font-size:13px;color:var(--sub)"><span style="color:var(--green)">● 取付穴ピッチ</span><br><span style="color:var(--ink);font-size:16px">'+holes.w+' × '+holes.h+'mm</span></div>';
  out+='</div>';
  return out;
}

    +'<div><div style="font-size:18px;font-weight:700;letter-spacing:.5px">マグネット互換サーチ <span class="mono amber" style="font-size:13px">PROTOTYPE</span></div>'
    +'<div style="font-size:12px;color:var(--sub)">電磁接触器・電磁開閉器・サーマルリレー 互換品検索</div></div></div>'
    +'<div style="display:flex;gap:6px">'
    +'<button class="mono" data-act="view" data-v="search" style="'+tabStyle(state.view==="search")+'">'+IC.search+' 互換検索</button>'
    +'<button class="mono" data-act="view" data-v="reference" style="'+tabStyle(state.view==="reference")+'">'+IC.book+' メーカー型式早見</button>'
    +'</div></div>';
}

function renderReference(){
  var h='<div class="wrap-ref"><div style="font-size:13px;color:var(--sub);margin-bottom:16px">国内主要メーカーの電磁接触器・電磁開閉器・サーマルリレーのシリーズ名を整理した早見表です(参考情報)。</div><div style="display:flex;flex-direction:column;gap:10px">';
  MAKER_REFERENCE.forEach(function(m){
    var exited=m.status==="撤退";
    h+='<div class="panel" style="border-radius:8px;padding:16px">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div class="mono" style="font-size:17px;font-weight:700;color:var(--amber)">'+esc(m.maker)+'</div>'
      +'<span class="mono" style="font-size:11px;padding:2px 8px;border-radius:4px;background:'+(exited?"rgba(232,163,61,0.12)":"rgba(76,175,125,0.12)")+';color:'+(exited?"#E8A33D":"#4CAF7D")+';border:1px solid '+(exited?"#7A5A2E":"#3A6B52")+'">'+esc(m.status)+'</span></div>'
      +'<div style="display:grid;grid-template-columns:88px 1fr;gap:6px 12px;font-size:13px">'
      +'<div class="mono" style="color:var(--sub)">接触器</div><div>'+esc(m.contactor)+'</div>'
      +'<div class="mono" style="color:var(--sub)">開閉器</div><div>'+esc(m.starter)+'</div>'
      +'<div class="mono" style="color:var(--sub)">サーマル</div><div>'+esc(m.thermal)+'</div></div>'
      +'<div style="font-size:12px;color:var(--sub);margin-top:10px;padding-top:10px;border-top:1px solid var(--line);line-height:1.6">'+esc(m.note)+'</div></div>';
  });
  h+='</div><div style="margin-top:20px;font-size:11px;color:var(--dim);line-height:1.6">※ シリーズ名・世代交代情報は変更される場合があります。選定・発注前に必ず各メーカー最新カタログで確認してください。</div></div>';
  return h;
}

function renderStepIndicator(){
  var steps=[{n:1,label:"既設品を検索"},{n:2,label:"仕様を確認"},{n:3,label:"互換品を表示"}];
  var h='<div style="display:flex;gap:0;padding:16px 24px 0;max-width:760px;margin:0 auto">';
  steps.forEach(function(s,i){
    var on=state.step>=s.n;
    h+='<div style="display:flex;align-items:center;flex:1">'
      +'<div class="mono" style="width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:'+(on?"#E8A33D":"#2A3644")+';color:'+(on?"#151C24":"#8A99A8")+'">'+s.n+'</div>'
      +'<div style="font-size:12px;margin-left:8px;color:'+(on?"#E8ECEF":"#8A99A8")+'">'+s.label+'</div>'
      +(i<2?'<div style="flex:1;height:1px;background:#354352;margin:0 12px"></div>':'')+'</div>';
  });
  return h+'</div>';
}

function renderSearchStep(){
  var cands=candidates();
  var h='<div class="wrap"><div class="panel" style="border-radius:8px;padding:24px">'
    +'<div style="font-size:13px;color:var(--sub);margin-bottom:16px">既設で使用中の機器の情報を入力してください。</div>';
  // 区分
  h+='<div style="margin-bottom:16px"><div style="font-size:12px;color:var(--sub);margin-bottom:6px">区分</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
  Object.keys(CATEGORY_META).forEach(function(v){
    var on=state.category===v;
    h+='<button data-act="cat" data-v="'+v+'" style="flex:1 1 auto;min-width:110px;padding:10px 12px;border-radius:6px;border:'+(on?"1px solid #E8A33D":"1px solid #354352")+';background:'+(on?"#2A2418":"#151C24")+';color:'+(on?"#E8A33D":"#E8ECEF")+';font-size:13px;font-weight:600">'+CATEGORY_META[v].label+'</button>';
  });
  h+='</div></div>';
  // メーカー
  h+='<div style="margin-bottom:6px;font-size:12px;color:var(--sub)">メーカー</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">';
  makersFor(state.category).forEach(function(m){
    var on=state.maker===m;
    h+='<button class="mono" data-act="maker" data-v="'+esc(m)+'" style="padding:8px 14px;border-radius:6px;border:'+(on?"1px solid #E8A33D":"1px solid #354352")+';background:'+(on?"#2A2418":"#151C24")+';color:'+(on?"#E8A33D":"#E8ECEF")+';font-size:13px;font-weight:600">'+esc(m)+'</button>';
  });
  h+='</div>';
  // 型式チップ
  h+='<div style="margin-bottom:6px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between"><span>登録されている型式(タップして選択)</span><span class="mono" style="color:var(--dim)">'+cands.length+'件</span></div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">';
  if(cands.length===0)h+='<div style="font-size:12px;color:var(--dim)">このメーカー・区分の登録データはありません。</div>';
  cands.forEach(function(c){
    var on=state.query===c.model;
    var tag=c.discontinued?('<span style="margin-left:6px;color:#8A99A8;font-weight:400">'+(c.makerExited?"(撤退)":"(生産終了)")+'</span>'):'';
    h+='<button class="mono" data-act="pick" data-v="'+esc(c.model)+'" style="display:flex;flex-direction:column;align-items:flex-start;padding:6px 10px;border-radius:6px;border:'+(on?"1px solid #E8A33D":"1px solid #354352")+';background:'+(on?"#2A2418":"#151C24")+';color:'+(on?"#E8A33D":"#E8ECEF")+';font-size:12px;font-weight:600">'
      +'<span>'+esc(c.model)+tag+'</span>'
      +'<span style="font-size:10px;color:#8A99A8;font-weight:400">'+esc(capacityDisplay(c))+(c.ratedKW?" / "+c.ratedKW+"kW":"")+'</span></button>';
  });
  h+='</div>';
  // 入力欄
  h+='<div style="margin-bottom:6px;font-size:12px;color:var(--sub)">既設品 型式</div>';
  h+='<input id="queryInput" class="mono" value="'+esc(state.query)+'" placeholder="'+(cands[0]?("例: "+esc(cands[0].model)):"型式を入力")+'" style="width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:14px">';
  // 取付方式
  h+='<div style="margin-top:16px;margin-bottom:6px;font-size:12px;color:var(--sub)">既設品の取付方式(盤内の現物を確認して選択)</div><div style="display:flex;gap:8px">';
  MOUNTING.forEach(function(m){
    var on=state.mountInput===m;
    h+='<button data-act="mount" data-v="'+m+'" style="flex:1;padding:10px 12px;border-radius:6px;border:'+(on?"1px solid #E8A33D":"1px solid #354352")+';background:'+(on?"#2A2418":"#151C24")+';color:'+(on?"#E8A33D":"#E8ECEF")+';font-size:13px;font-weight:600">'+m+'</button>';
  });
  h+='</div>';
  if(state.mountMissing)h+='<div style="margin-top:8px;font-size:12px;color:var(--amber);display:flex;align-items:center;gap:6px">'+IC.warn+' 既設品の取付方式を選択してください。</div>';
  h+='<div style="margin-top:20px"><button data-act="search" style="width:100%;padding:10px 18px;background:var(--amber);color:#151C24;border:none;border-radius:6px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px">'+IC.search+' 検索</button></div>';
  if(state.notFound)h+='<div style="margin-top:14px;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--amber)">'+IC.warn+'<div>該当する型式がサンプルデータ内に見つかりません。入力候補:<span class="mono"> '+cands.map(function(c){return esc(c.model);}).join(" / ")+'</span></div></div>';
  h+='</div></div>';
  return h;
}

function renderConfirm(){
  var m=findDevice(state.matchedId);if(!m)return "";
  var meta=CATEGORY_META[m.category]||{};
  var h='<div class="wrap"><button data-act="step" data-v="1" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-size:12px;padding:0">'+IC.back+' 検索に戻る</button>';
  h+='<div class="panel" style="border-radius:8px;padding:0;margin-top:12px;overflow:hidden">'
    +'<div style="background:#232E3A;padding:10px 20px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)">この仕様で間違いありませんか?現物の銘板と照合してください。</div><div style="padding:24px">';
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px"><div><div style="font-size:11px;color:var(--sub)">'+esc(m.maker)+'</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--amber)">'+esc(m.model)+'</div></div><div style="font-size:11px;color:var(--sub);text-align:right">'+esc(meta.label||"")+'</div></div>';
  if(m.discontinued){
    var inner;
    if(m.makerExited){inner=esc(m.maker)+'はこの製品分野から事業撤退しており、同メーカーでの後継機種はありません。次の互換品一覧では他メーカー品を候補として表示します。';}
    else{var ch=successorChain(m);inner=ch.length?('同メーカーの後継機種:<span class="mono green" style="margin-left:4px">'+ch.map(function(d){return esc(d.model);}).join(" → ")+'</span>&nbsp;&nbsp;次の互換品一覧では後継機種を最優先候補として表示します。'):'';}
    h+='<div style="display:flex;gap:8px;align-items:flex-start;font-size:12px;background:rgba(232,163,61,0.08);border:1px solid #7A5A2E;border-radius:6px;padding:12px;margin-bottom:20px"><span class="amber">'+IC.warn+'</span><div><span class="amber" style="font-weight:700">生産終了品</span>です。'+inner+'</div></div>';
  }
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">';
  h+=specBox(meta.primaryLabel||"定格電流",capacityDisplay(m));
  if(m.ratedKW)h+=specBox("適用モータ容量",m.ratedKW+" kW");
  if(m.coil&&m.coil!=="-")h+=specBox("操作コイル",m.coil);
  h+=specBox("取付方式(入力値)",state.mountInput||m.mounting);
  if(m.aux)h+=specBox("補助接点構成",auxLabel(m.aux));
  h+='</div>';
  if(state.mountInput&&state.mountInput!==m.mounting){
    h+='<div style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--amber);margin-bottom:20px;margin-top:-8px">'+IC.warn+'<div>'+esc(m.model)+' のメーカー標準取付方式は「'+esc(m.mounting)+'」です。入力された「'+esc(state.mountInput)+'」はオプション金具等での変更、または品番違いの可能性があります。現物を再確認してください。</div></div>';
  }
  if(!m.dims||m.unverified){
    h+='<div style="display:flex;gap:8px;align-items:flex-start;font-size:12px;background:rgba(232,163,61,0.08);border:1px solid #7A5A2E;border-radius:6px;padding:12px"><span class="amber">'+IC.warn+'</span><div><span class="amber" style="font-weight:700">寸法データ未登録</span>&nbsp;この型式は外形寸法・取付穴ピッチが未入手のため、寸法図と穴の一致判定は表示しません。互換候補は容量クラスでの一致のみで抽出しています。取付可否は必ずメーカー外形図と現物で確認してください。</div></div>';
  }else{
    h+='<div style="font-size:12px;color:var(--sub);margin-bottom:8px">'+(m.holes?"外形寸法・取付穴寸法(mm)":"外形寸法(mm)")+'</div>'+dimDiagram(m.dims,m.holes);
  }
  h+='<div style="display:flex;gap:10px;margin-top:24px">'
    +'<button data-act="step" data-v="3" style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:var(--green);color:#0F1A14;border:none;border-radius:6px;font-weight:700;font-size:13px">'+IC.check+' はい、この仕様で間違いありません</button>'
    +'<button data-act="step" data-v="1" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-weight:600;font-size:13px">'+IC.refresh+' 型式を再入力</button></div>';
  h+='</div></div></div>';
  return h;
}

function renderResult(){
  var m=findDevice(state.matchedId);if(!m)return "";
  var meta=CATEGORY_META[m.category]||{};
  var list=computeCompatibles(m,state.mountInput);
  var h='<div class="wrap"><button data-act="reset" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-size:12px;padding:0">'+IC.back+' 最初から検索</button>';
  h+='<div style="margin:12px 0 16px;font-size:13px;color:var(--sub)"><span class="mono green">'+esc(m.model)+'</span>('+esc(meta.primaryLabel||"定格")+' '+esc(capacityDisplay(m))+' / '+esc(state.mountInput||m.mounting)+(m.aux?(" / "+auxLabel(m.aux)):"")+')の互換品候補です。主要スペック → 取付方式 → 補助接点構成 → 取付穴寸法 → 外形寸法差 の順で並べています。</div>';
  if(list.length===0)h+='<div class="panel" style="padding:20px;border-radius:8px;font-size:13px;color:var(--sub)">サンプルデータ内に互換候補が登録されていません。</div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px">';
  list.forEach(function(c,idx){
    var tag=c.isSuccessor?'<span style="margin-left:6px;color:#E8A33D;font-weight:700">メーカー後継品</span>':(idx===0?'<span class="green" style="margin-left:6px">候補No.1</span>':'');
    h+='<div class="panel" style="border-radius:8px;padding:16px"><div style="display:flex;justify-content:space-between;align-items:center"><div>'
      +'<div style="font-size:11px;color:var(--sub)">'+esc(c.maker)+tag+'</div>'
      +'<div class="mono" style="font-size:18px;font-weight:700">'+esc(c.model)+'</div>'
      +'<div style="font-size:12px;color:var(--sub);margin-top:4px">'+esc(meta.primaryLabel||"定格")+' <span class="mono">'+esc(capacityDisplay(c))+'</span>'+(c.ratedKW?(' / <span class="mono">'+c.ratedKW+'kW</span>'):'')
      +(c.dims?('&nbsp;&nbsp;・&nbsp;&nbsp;外形 <span class="mono">'+c.dims.w+'×'+c.dims.h+'×'+c.dims.d+'mm</span>'):'&nbsp;&nbsp;・&nbsp;&nbsp;<span class="amber">外形寸法 未登録</span>')
      +(c.dims&&c.holes?('&nbsp;&nbsp;・&nbsp;&nbsp;取付穴 <span class="mono">'+c.holes.w+'×'+c.holes.h+'mm</span>'):'')+'</div>'
      +'<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'+badge(c.mountingMatch,c.mounting)+(m.aux?badge(c.auxMatch,auxLabel(c.aux)):'')
      +(c.unverifiedDims?'<span class="mono" style="font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(232,163,61,0.12);color:#E8A33D;border:1px solid #7A5A2E">? 寸法要検証</span>':(m.holes?badge(c.holeMatch,c.holes?("穴 "+c.holes.w+"×"+c.holes.h+"mm"):"穴 -"):''))+'</div>'
      +'</div><div style="text-align:right;flex-shrink:0;padding-left:12px"><div style="font-size:11px;color:var(--sub)">寸法差分</div><div class="mono" style="font-size:14px;color:'+(c.diff===null?"#8A99A8":(c.diff===0?"#4CAF7D":"#E8A33D"))+'">'+(c.diff===null?"—":(c.diff===0?"完全一致":("Σ"+c.diff+"mm")))+'</div></div></div></div>';
  });
  h+='</div><div style="margin-top:20px;font-size:11px;color:var(--dim);line-height:1.6"><span style="color:var(--sub)">※ 本プロトタイプの数値はサンプル・推定を含みます。△表示は取付方式・補助接点構成・取付穴寸法のいずれかが既設品と異なることを示します。サーマルは標準形/KP形(欠相保護)を別クラスとして区別しています。実際の選定・発注前には必ずメーカー最新カタログおよび現物銘板・取扱説明書で確認してください。</span></div></div>';
  return h;
}

function render(){
  var h=renderHeader();
  if(state.view==="reference"){h+=renderReference();}
  else{
    h+=renderStepIndicator();
    if(state.step===1)h+=renderSearchStep();
    else if(state.step===2)h+=renderConfirm();
    else h+=renderResult();
  }
  var root=document.getElementById("app");
  root.innerHTML='<div style="min-height:100vh;padding-bottom:40px">'+h+'</div>';
  var qi=document.getElementById("queryInput");
  if(qi){qi.addEventListener("input",function(){state.query=qi.value;});
    qi.addEventListener("keydown",function(e){if(e.key==="Enter"){doSearch();}});}
}

/* ================= 操作 ================= */
function doSearch(){
  var qi=document.getElementById("queryInput");
  if(qi)state.query=qi.value;
  if(!state.mountInput){state.mountMissing=true;render();return;}
  state.mountMissing=false;
  var found=null,cs=candidates();
  for(var i=0;i<cs.length;i++){if(norm(cs[i].model)===norm(state.query)){found=cs[i];break;}}
  if(found){state.matchedId=found.id;state.notFound=false;state.step=2;}
  else{state.notFound=true;state.matchedId=null;}
  render();
}
function resetAll(){state.step=1;state.query="";state.mountInput="";state.matchedId=null;state.notFound=false;state.mountMissing=false;render();}

document.getElementById("app").addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var act=t.getAttribute("data-act"),v=t.getAttribute("data-v");
  if(act==="view"){state.view=v;}
  else if(act==="cat"){state.category=v;var av=makersFor(v);if(av.indexOf(state.maker)<0)state.maker=av[0];state.query="";state.notFound=false;}
  else if(act==="maker"){state.maker=v;state.query="";state.notFound=false;}
  else if(act==="pick"){state.query=v;state.notFound=false;}
  else if(act==="mount"){state.mountInput=v;state.mountMissing=false;}
  else if(act==="search"){doSearch();return;}
  else if(act==="step"){state.step=parseInt(v,10);}
  else if(act==="reset"){resetAll();return;}
  render();
});

render();
</script>
